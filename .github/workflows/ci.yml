name: ci

on:
  pull_request:
  push:
    branches: [main, master]

# PR validation is static only: no live credentials, no applies.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  opentofu:
    name: opentofu (fmt / validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.1"
      - name: tofu fmt
        run: tofu fmt -check -recursive
      - name: tofu validate per root
        shell: bash
        run: |
          set -euo pipefail
          roots=$(grep -rl --include='*.tf' -e '^terraform {' . 2>/dev/null | xargs -r -n1 dirname | sort -u || true)
          if [ -z "$roots" ]; then echo "no OpenTofu roots yet"; exit 0; fi
          for d in $roots; do
            echo "::group::validate $d"
            (cd "$d" && tofu init -backend=false -input=false && tofu validate)
            echo "::endgroup::"
          done

  kubernetes:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install validators
        run: |
          set -euo pipefail
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin kustomize
      - name: validate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find kubernetes -name kustomization.yaml -exec dirname {} \; 2>/dev/null || true)
          if [ ${#dirs[@]} -eq 0 ]; then echo "no kustomizations yet"; exit 0; fi
          for d in "${dirs[@]}"; do
            echo "::group::build $d"
            kustomize build "$d" | kubeconform -strict -summary -ignore-missing-schemas -
            echo "::endgroup::"
          done

  lint:
    name: lint (docs / yaml / shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install linters
        run: |
          set -euo pipefail
          npm install -g markdownlint-cli2
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck
      - name: markdownlint
        run: markdownlint-cli2 "**/*.md"
      - name: yamllint
        run: yamllint .
      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sh < <(find . -name '*.sh' -not -path './.git/*')
          if [ ${#sh[@]} -eq 0 ]; then echo "no shell scripts"; exit 0; fi
          shellcheck -x "${sh[@]}"
