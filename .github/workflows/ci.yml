name: ci

on:
  pull_request:
  push:
    branches: [main, master]

# PR validation is static only: no live credentials, no applies.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned CI tool versions (reproducibility — see versions.yaml `meta.policy`).
# Binary tools are installed, checksum-verified where upstream publishes a checksum, by
# scripts/ci/install-ci-tools.sh. The node/python tools are pinned here because they come
# from their package registries. Bump these deliberately, in one place.
env:
  # renovate: datasource=npm depName=markdownlint-cli2
  MARKDOWNLINT_CLI2_VERSION: "0.23.3"
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: "1.38.0"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.176.2"

jobs:
  # GitHub-only: gitleaks-action can't be cloned anonymously, so `act` skips it.
  # Run it locally instead with `just secrets` (gitleaks binary or the container image).
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SOPS gate (L0): every would-be-committed `*.sops.yaml` / `*.sops.yml` / `*.sops.json`
  # must actually be encrypted. It is static — it needs no private key — and sops is
  # installed by the pinned, checksum-verified installer, so unlike `secret-scan` this job
  # DOES run under `act` (`just ci`). `gitleaks` above remains the second net.
  secrets:
    name: secrets (sops gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install sops (pinned)
        run: scripts/ci/install-ci-tools.sh sops
      - name: sops check
        run: ./scripts/secrets/check.sh --check

  opentofu:
    name: opentofu (fmt / validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.1"
      - name: tofu fmt
        run: tofu fmt -check -recursive
      - name: tofu validate per root
        shell: bash
        run: |
          set -euo pipefail
          roots=$(git ls-files -co --exclude-standard -z '*.tf' | xargs -0 -r grep -l -e '^terraform {' 2>/dev/null | xargs -r -n1 dirname | sort -u || true)
          if [ -z "$roots" ]; then echo "no OpenTofu roots yet"; exit 0; fi
          for d in $roots; do
            echo "::group::validate $d"
            (cd "$d" && tofu init -backend=false -input=false && tofu validate)
            echo "::endgroup::"
          done

  kubernetes:
    name: kubernetes manifests (kustomize + kubeconform + cluster settings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install validators (pinned)
        run: scripts/ci/install-ci-tools.sh kubeconform kustomize yq
      - name: cluster settings (post-build substitution guard)
        # Flux substitutes an undefined ${VAR} with an empty string, so check statically.
        run: scripts/ci/check-cluster-settings.sh
      - name: validate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find kubernetes -name kustomization.yaml -exec dirname {} \; 2>/dev/null || true)
          if [ ${#dirs[@]} -eq 0 ]; then echo "no kustomizations yet"; exit 0; fi
          for d in "${dirs[@]}"; do
            echo "::group::build $d"
            # `del(.sops)`: SOPS metadata on encrypted Secrets is not part of the Secret schema.
            kustomize build "$d" | yq 'del(.sops)' | kubeconform -strict -summary -ignore-missing-schemas -
            echo "::endgroup::"
          done

  # Abstract render check: catches HelmRelease `values` that break a chart's templates
  # without a live cluster (the technitium `service.type` bug). No credentials, no apply.
  render:
    name: helm render (abstract, no cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install helm + yq (pinned)
        run: scripts/ci/install-ci-tools.sh helm yq
      - name: render every HelmRelease
        run: scripts/ci/render-helm-releases.sh

  lint:
    name: lint (workflows / docs / yaml / shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # renovate needs node ^24.11 (the config validator step below).
          node-version: "24"
      - name: install binary linters (pinned)
        run: scripts/ci/install-ci-tools.sh actionlint shellcheck
      - name: install markdownlint-cli2 (pinned)
        run: npm install -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
      - name: actionlint
        run: actionlint
      - name: renovate config (pinned validator)
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict
      - name: markdownlint
        run: markdownlint-cli2 "**/*.md"
      - name: yamllint (pinned, isolated venv)
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP:-$HOME}/yamllint-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --disable-pip-version-check -q "yamllint==${YAMLLINT_VERSION}"
          "$venv/bin/yamllint" .
      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sh < <(find . -name '*.sh' -not -path './.git/*')
          if [ ${#sh[@]} -eq 0 ]; then echo "no shell scripts"; exit 0; fi
          shellcheck -x "${sh[@]}"
      - name: backup alert self-test (local SMTP sinks, systemd-analyze verify)
        run: scripts/backup/test/alert-selftest.sh
