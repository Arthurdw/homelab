# SOPS creation rules for the homelab repository.
#
# Design:  docs/secrets-and-state.md   (Phase 1 secret strategy — SOPS + age)
# Runbook: docs/runbooks/secrets.md    (key ceremony, add/rotate, recovery, CI)
#
# Rules to obey when editing this file:
#   * ONLY public `age1...` recipients belong here — the private key never enters this repo.
#   * The FIRST rule whose `path_regex` matches the target file wins (top-to-bottom).
#   * Keep the two environments strictly separated: lab first, production second.
creation_rules:
  # ---------------------------------------------------------------------------
  # LAB — disposable/local secrets only (kind cluster, local fixtures, SOPS
  # round-trip tests). These are NOT production credentials and may be rotated
  # or deleted at will.
  #
  # Recipient provenance (why this public key is safe to commit):
  #   * generated by `age-keygen` on this workstation, private key stored OUTSIDE
  #     the repo at ~/.config/homelab/lab-age.key (mode 600);
  #   * the public recipient below was extracted with:
  #       age-keygen -y ~/.config/homelab/lab-age.key
  #   * created by scripts/secrets/init-age.sh and installed into the *lab*
  #     cluster as the `sops-age` Secret by scripts/lab/lab-up.sh.
  #
  # Path convention: a `*.lab.sops.<yaml|yml|json>` file, or any SOPS file under
  # a `lab/` path segment.
  - path_regex: '(^|/)lab/.*\.sops\.(ya?ml|json)$|\.lab\.sops\.(ya?ml|json)$'
    age: >-
      age1x3eaxap6flcq64ujtc0lks04pa70n6ju43y0dv7x2a2tj262s90qlf82q5

  # ---------------------------------------------------------------------------
  # PRODUCTION — real homelab cluster secrets (Flux `Secret` manifests, etc.).
  #
  # TODO(GATE 4): replace the placeholder below with the production age recipient
  #   created during the OFFLINE key ceremony documented in
  #   docs/runbooks/secrets.md. Ceremony in short:
  #     1. On an offline/air-gapped machine: `age-keygen -o prod-age.key`
  #     2. Store prod-age.key in a password manager AND on separate offline media.
  #        NEVER copy it into this repository, CI, or the cluster's git history.
  #     3. Paste ONLY the `age1...` public recipient here.
  #   Until then, encrypting a production secret FAILS CLOSED: sops rejects this
  #   placeholder ("unknown recipient type"), so no production secret can ever be
  #   committed to a key we do not control.
  - path_regex: '\.sops\.(ya?ml|json)$'
    age: >-
      REPLACE_AT_GATE_4_WITH_PRODUCTION_AGE_RECIPIENT
