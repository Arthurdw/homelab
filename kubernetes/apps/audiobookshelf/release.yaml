---
# Audiobookshelf — self-hosted audiobook/podcast server.
#   Chart:  https://charts.christianhuth.de/audiobookshelf 2.5.1 (appVersion 2.37.1)
#   Notes:  docs/apps/audiobookshelf.md
#
# Storage split (decisions.md §4.1 / §4.3):
#   * config   → the SQLite database (users/books/libraries/settings). MUST NOT be on network storage
#                → `local-path` on the node SSD.
#   * library  → bulk audiobook media → the NAS over NFS (`nas-nfs`).
#   * metadata → covers/cache/streams (regenerable but large) → the NAS over NFS.
#   * backup   → the app's built-in logical backups (DB + selected metadata) → the NAS over NFS.
#
# EXPOSURE: only the web UI (the single Service, HTTP) is published through Traefik. Audiobookshelf has
# no separate admin port; access is LAN/Tailscale only — never the public internet (decisions.md §5.2).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  interval: 1h
  chart:
    spec:
      chart: audiobookshelf
      version: 2.5.1
      sourceRef:
        kind: HelmRepository
        name: christianhuth
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      # Pin the app image explicitly (defaults to the chart's appVersion, but be explicit).
      tag: "2.37.1"
      # Reproducible, no surprise re-pulls.
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: internal-ca
      hosts:
        # Internal zone <app>.lab.ardw.be (decisions.md §5.7), served by Technitium only.
        # TODO: switch the issuer from internal-ca to Let's Encrypt DNS-01 once configured.
        - host: audiobookshelf.lab.ardw.be
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: audiobookshelf-tls
          hosts:
            - audiobookshelf.lab.ardw.be

    audiobookshelf:
      # TODO(timezone): set to the owner's real TZ when the app is handed over.
      timezone: Etc/UTC

      # --- SQLite database + settings: node SSD only (never the network) --------------------------
      config:
        persistence:
          storageClassName: local-path
          resources:
            requests:
              storage: 5Gi

      # --- bulk media: the NAS -------------------------------------------------------------------
      library:
        persistence:
          storageClassName: nas-nfs
          resources:
            requests:
              storage: 500Gi

      # --- covers/cache/streams: the NAS (regenerable, but large) --------------------------------
      metadata:
        persistence:
          storageClassName: nas-nfs
          resources:
            requests:
              storage: 50Gi

      # --- the app's own logical backups (DB + selected metadata) → the NAS ----------------------
      # Enable the schedule in Settings → Backups (in-app); see docs/apps/audiobookshelf.md.
      backup:
        persistence:
          storageClassName: nas-nfs
          resources:
            requests:
              storage: 20Gi
