---
# Authentik blueprints, mounted into the server and worker by the chart (`blueprints.configMaps` in
# release.yaml) and applied by the worker. One file per app that signs in through Authentik (home.yaml is the
# forward-auth one, with the embedded outpost), plus portal.yaml, recovery.yaml (password reset by email) and
# household.yaml (the household users): together they make the Authentik user dashboard
# (https://auth.lab.ardw.be/if/user/) the homelab portal.
# Applications are grouped by `group`: "Apps" for household apps, "Infrastructure" for admin UIs. Every
# Infrastructure application has a group policy binding to `authentik Admins`, so only admins see its tile or
# can sign in to it; Apps have no binding and are open to every user.
#
# Every OIDC client secret follows the same pattern: the `client-secret` key of the Secret
# `authentik-<app>-oidc` (namespace authentik), exposed to the worker as AUTHENTIK_<APP>_OIDC_SECRET (global.env
# in release.yaml) and read below with !Env. The same value sits in the app's own Secret where the app reads it
# from Kubernetes (seafile/seafile-oidc, monitoring/grafana-oidc); Immich, Audiobookshelf, Technitium and
# Proxmox keep it in their own configuration, set once (docs/runbooks/sso.md): `just audiobookshelf-oauth`,
# `just technitium-sso`, `just immich-oauth`, and `pveum` for Proxmox.
# scripts/secrets/gen-*-secrets.sh write the Secrets.
#
# Authentik 2026.x refuses every grant a provider doesn't list ("Invalid grant_type for provider"), so every
# provider lists grant_types.
#
# seafile.yaml: the OAuth2/OpenID provider and the application for Seafile (decisions.md §5.8). Seahub's side
# is the OAUTH_* block in kubernetes/apps/seafile/seafile.yaml. The client secret is the `client-secret` key of
# the Secret `authentik-seafile-oidc`, exposed to the worker as AUTHENTIK_SEAFILE_OIDC_SECRET (global.env in
# release.yaml); Seafile reads the same value from its own Secret `seafile-oidc`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
data:
  seafile.yaml: |
    version: 1
    metadata:
      name: Seafile
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: seafile-provider
        identifiers:
          name: Seafile
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: seafile
          # Authentik 2026.x refuses every grant a provider doesn't list ("Invalid grant_type for provider").
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env AUTHENTIK_SEAFILE_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://files.ardw.be/oauth/callback/
            # Old name, kept while seafile.lab.ardw.be redirects (decisions.md §5.13).
            - matching_mode: strict
              url: https://seafile.lab.ardw.be/oauth/callback/
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # Stable per-user id, so Seafile's uid survives an email change (seafile.yaml OAUTH_ATTRIBUTE_MAP).
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        id: seafile-app
        identifiers:
          slug: seafile
        attrs:
          name: Seafile
          provider: !KeyOf seafile-provider
          group: Apps
          meta_launch_url: https://files.ardw.be/
          meta_description: Files and sync
  grafana.yaml: |
    # Grafana (kube-prometheus-stack, kubernetes/infrastructure/monitoring/release.yaml, grafana.ini
    # auth.generic_oauth). The profile scope carries `groups`: members of `authentik Admins` become Grafana Admins.
    version: 1
    metadata:
      name: Grafana
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: Grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env AUTHENTIK_GRAFANA_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.lab.ardw.be/login/generic_oauth
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        id: grafana-app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          group: Infrastructure
          meta_launch_url: https://grafana.lab.ardw.be/
          meta_description: Dashboards and metrics
      # Infrastructure: only `authentik Admins` sees the tile and may sign in (header).
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf grafana-app
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs:
          order: 0
          enabled: true
          negate: false
  immich.yaml: |
    # Immich: its OAuth settings live in its own database (Administration -> Settings -> OAuth,
    # docs/runbooks/sso.md). app.immich:///oauth-callback is the mobile app's callback; strict matching is a
    # plain string comparison, so the custom scheme needs no regex.
    version: 1
    metadata:
      name: Immich
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: immich-provider
        identifiers:
          name: Immich
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: immich
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env AUTHENTIK_IMMICH_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://immich.lab.ardw.be/auth/login
            - matching_mode: strict
              url: https://immich.lab.ardw.be/user-settings
            - matching_mode: strict
              url: app.immich:///oauth-callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        id: immich-app
        identifiers:
          slug: immich
        attrs:
          name: Immich
          provider: !KeyOf immich-provider
          group: Apps
          meta_launch_url: https://immich.lab.ardw.be/
          meta_description: Photos and videos
  audiobookshelf.yaml: |
    # Audiobookshelf: its OpenID settings live in its own database (Settings -> Authentication,
    # docs/runbooks/sso.md). mobile-redirect is where the mobile apps' login lands before ABS hands it back.
    # ABS matches existing users by email only when email_verified isn't false, and authentik's default email
    # mapping always sends false, so ABS gets its own email mapping that sends true. Every other provider finds
    # the default one by its managed identifier: a second scope_name=email mapping makes that lookup ambiguous.
    version: 1
    metadata:
      name: Audiobookshelf
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.scopemapping
        id: audiobookshelf-email
        identifiers:
          name: "homelab OAuth Mapping: Audiobookshelf 'email' (verified)"
        attrs:
          scope_name: email
          description: Email address
          expression: |
            return {
                "email": request.user.email,
                "email_verified": True,
            }
      - model: authentik_providers_oauth2.oauth2provider
        id: audiobookshelf-provider
        identifiers:
          name: Audiobookshelf
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: audiobookshelf
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env AUTHENTIK_AUDIOBOOKSHELF_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://audiobookshelf.lab.ardw.be/auth/openid/callback
            - matching_mode: strict
              url: https://audiobookshelf.lab.ardw.be/auth/openid/mobile-redirect
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !KeyOf audiobookshelf-email
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        id: audiobookshelf-app
        identifiers:
          slug: audiobookshelf
        attrs:
          name: Audiobookshelf
          provider: !KeyOf audiobookshelf-provider
          group: Apps
          meta_launch_url: https://audiobookshelf.lab.ardw.be/
          meta_description: Audiobooks and podcasts
  proxmox.yaml: |
    # Proxmox VE (poseidon): an OpenID realm on the PVE side, set up once by hand with `pveum realm add`
    # (docs/runbooks/sso.md, Proxmox). PVE sends the bare origin of the page as redirect_uri, no path; the
    # trailing-slash form is allowed too. preferred_username (profile scope) becomes the PVE user name.
    version: 1
    metadata:
      name: Proxmox
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: proxmox-provider
        identifiers:
          name: Proxmox
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: proxmox
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env AUTHENTIK_PROXMOX_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://poseidon.lab.ardw.be:8006
            - matching_mode: strict
              url: https://poseidon.lab.ardw.be:8006/
            # Through Traefik (docs/runbooks/host-proxies.md); the :8006 pair above is the break-glass path.
            - matching_mode: strict
              url: https://pve.lab.ardw.be
            - matching_mode: strict
              url: https://pve.lab.ardw.be/
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        id: proxmox-app
        identifiers:
          slug: proxmox
        attrs:
          name: Proxmox
          provider: !KeyOf proxmox-provider
          group: Infrastructure
          meta_launch_url: https://pve.lab.ardw.be/
          meta_description: Hypervisor (pick the "authentik" realm)
          open_in_new_tab: true
      # Infrastructure: only `authentik Admins` sees the tile and may sign in (header).
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf proxmox-app
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs:
          order: 0
          enabled: true
          negate: false
  technitium.yaml: |
    # Technitium DNS (15.x has native OIDC SSO): its SSO settings live in its own config (Administration -> SSO,
    # docs/runbooks/sso.md); the DNS_SERVER_SSO_* env vars only apply on a first start without config. The
    # callback is fixed at /sso/callback. The profile scope carries `groups`, mapped to Technitium's local
    # groups in its SSO Group Map.
    version: 1
    metadata:
      name: Technitium
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: technitium-provider
        identifiers:
          name: Technitium
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: technitium
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env AUTHENTIK_TECHNITIUM_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://dns.lab.ardw.be/sso/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        id: technitium-app
        identifiers:
          slug: technitium
        attrs:
          name: Technitium
          provider: !KeyOf technitium-provider
          group: Infrastructure
          meta_launch_url: https://dns.lab.ardw.be/
          meta_description: DNS
          open_in_new_tab: true
      # Infrastructure: only `authentik Admins` sees the tile and may sign in (header).
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf technitium-app
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs:
          order: 0
          enabled: true
          negate: false
  home.yaml: |
    # Homepage (kubernetes/apps/homepage) behind forward-auth: a proxy provider in forward_single mode, served
    # by the embedded outpost (inside authentik-server). Traefik asks it through the shared Middleware
    # authentik/forward-auth (forward-auth.yaml), and the outpost's own paths on the host are routed to
    # authentik-server by the Ingress `authentik-outpost` there. To protect another host, add a provider and
    # application like these, the provider to the outpost's list below, and the host to that Ingress
    # (docs/runbooks/sso.md, Forward-auth).
    version: 1
    metadata:
      name: Forward-auth (Homepage)
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: home-provider
        identifiers:
          name: Home
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://home.lab.ardw.be
      - model: authentik_core.application
        id: home-app
        identifiers:
          slug: home
        attrs:
          name: Home
          provider: !KeyOf home-provider
          group: Apps
          meta_launch_url: https://home.lab.ardw.be/
          meta_description: Homelab dashboard
      # The embedded outpost exists from the first start (managed by authentik); this only sets its providers
      # and config. `providers` is the full list: every forward-auth provider must be in it.
      # authentik_host is where the outpost sends browsers to log in. The chart's ServiceAccount gives authentik
      # a local Kubernetes connection; the outpost's own Ingress, Middleware and HTTPRoute are disabled because
      # forward-auth.yaml declares the routing in git.
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          name: authentik Embedded Outpost
          type: proxy
          providers:
            - !KeyOf home-provider
          config:
            authentik_host: https://auth.lab.ardw.be/
            authentik_host_insecure: false
            kubernetes_disabled_components:
              - ingress
              - traefik middleware
              - httproute
  portal.yaml: |
    # Link-only applications: no provider, just a dashboard tile that opens the UI, which keeps its own login.
    # Kopia, TrueNAS and UniFi have no generic OIDC login (docs/runbooks/sso.md); Proxmox and Technitium have
    # their own OIDC applications above.
    # Bound to `authentik Admins` like the other Infrastructure tiles; the targets keep their own login.
    version: 1
    metadata:
      name: Homelab portal links
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.application
        id: kopia-app
        identifiers:
          slug: kopia
        attrs:
          name: Kopia
          group: Infrastructure
          meta_launch_url: https://kopia.lab.ardw.be/
          meta_description: Backup repository server (own login, no OIDC)
          open_in_new_tab: true
      # Infrastructure: only `authentik Admins` sees the tile and may sign in (header).
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf kopia-app
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs:
          order: 0
          enabled: true
          negate: false
      - model: authentik_core.application
        id: truenas-app
        identifiers:
          slug: truenas
        attrs:
          name: TrueNAS
          group: Infrastructure
          meta_launch_url: https://nas.lab.ardw.be/
          meta_description: NAS (own login)
          open_in_new_tab: true
      # Infrastructure: only `authentik Admins` sees the tile and may sign in (header).
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf truenas-app
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs:
          order: 0
          enabled: true
          negate: false
      - model: authentik_core.application
        id: unifi-app
        identifiers:
          slug: unifi
        attrs:
          name: UniFi
          group: Infrastructure
          meta_launch_url: https://unifi.lab.ardw.be/
          meta_description: Network (own login)
          open_in_new_tab: true
      # Infrastructure: only `authentik Admins` sees the tile and may sign in (header).
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf unifi-app
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs:
          order: 0
          enabled: true
          negate: false
  recovery.yaml: |
    # Password recovery by email (docs/runbooks/sso.md, "Add a household user"). Authentik ships this flow only as
    # an example blueprint, which is never instantiated and so cannot be pulled in with metaapplyblueprint; this
    # is the upstream `example/flows-recovery-email-verification.yaml` (2026.8) with a longer link lifetime. It
    # sets the brand's recovery flow, which the admin "Send recovery link" action needs, and adds "Forgot username
    # or password?" to the login page. Mail goes through the global SMTP settings (release.yaml `email`).
    version: 1
    metadata:
      name: Homelab password recovery
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_flows.flow
        id: flow
        identifiers:
          slug: default-recovery-flow
        attrs:
          name: Default recovery flow
          title: Set your password
          designation: recovery
          authentication: require_unauthenticated
      - model: authentik_stages_prompt.prompt
        id: prompt-field-password
        identifiers:
          name: default-recovery-field-password
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          order: 0
          placeholder_expression: false
      - model: authentik_stages_prompt.prompt
        id: prompt-field-password-repeat
        identifiers:
          name: default-recovery-field-password-repeat
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          order: 1
          placeholder_expression: false
      # A link made by an admin already names the user ("restored" plan), so the identification stage is skipped.
      - model: authentik_policies_expression.expressionpolicy
        id: default-recovery-skip-if-restored
        identifiers:
          name: default-recovery-skip-if-restored
        attrs:
          expression: |
            return bool(request.context.get('is_restored', True))
      - model: authentik_stages_email.emailstage
        id: default-recovery-email
        identifiers:
          name: default-recovery-email
        attrs:
          use_global_settings: true
          # A day rather than upstream's 30 minutes: the first link goes to a new user who may not open it at once.
          token_expiry: hours=24
          subject: Set your homelab password
          template: email/password_reset.html
          activate_user_on_success: true
          recovery_max_attempts: 5
          recovery_cache_timeout: minutes=5
      - model: authentik_stages_user_write.userwritestage
        id: default-recovery-user-write
        identifiers:
          name: default-recovery-user-write
        attrs:
          user_creation_mode: never_create
      - model: authentik_stages_identification.identificationstage
        id: default-recovery-identification
        identifiers:
          name: default-recovery-identification
        attrs:
          user_fields:
            - email
            - username
      - model: authentik_stages_user_login.userloginstage
        id: default-recovery-user-login
        identifiers:
          name: default-recovery-user-login
      - model: authentik_stages_prompt.promptstage
        id: stages-prompt-password
        identifiers:
          name: Change your password
        attrs:
          fields:
            - !KeyOf prompt-field-password
            - !KeyOf prompt-field-password-repeat
          validation_policies: []
      - model: authentik_flows.flowstagebinding
        id: flow-binding-identification
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-identification
          order: 10
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-email
          order: 20
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf stages-prompt-password
          order: 30
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-user-write
          order: 40
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-user-login
          order: 100
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf default-recovery-skip-if-restored
          target: !KeyOf flow-binding-identification
          order: 0
        attrs:
          negate: false
          enabled: true
          timeout: 30
      # Only the recovery flow is set; the default brand's other flows stay as Authentik made them.
      - model: authentik_brands.brand
        state: present
        identifiers:
          domain: authentik-default
        attrs:
          flow_recovery: !KeyOf flow
      - model: authentik_stages_identification.identificationstage
        state: present
        identifiers:
          name: default-authentication-identification
        attrs:
          recovery_flow: !KeyOf flow
  household.yaml: |
    # The household users and their group (docs/runbooks/sso.md, "Add a household user"). The blueprint owns
    # username, name, email, type and group membership: it re-applies them, so change them here, not in the UI.
    # Passwords are never here; each user sets one through a recovery link. The emails stay out of git: they are
    # the Secret `authentik-users` (dunia-email, jolien-email), exposed as AUTHENTIK_USER_<NAME>_EMAIL (global.env
    # in release.yaml, optional). Until that Secret exists the users have no email, so no recovery link can reach
    # them; once it exists and the server and worker restart, the next apply fills it in.
    # The owner's own account and `authentik Admins` are managed in the UI, not here.
    version: 1
    metadata:
      name: Homelab household users
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        id: household
        state: present
        identifiers:
          name: household
      - model: authentik_core.user
        state: present
        identifiers:
          username: dunia
        attrs:
          name: Dunia
          email: !Env [AUTHENTIK_USER_DUNIA_EMAIL, ""]
          type: internal
          groups:
            - !KeyOf household
      - model: authentik_core.user
        state: present
        identifiers:
          username: jolien
        attrs:
          name: Jolien
          email: !Env [AUTHENTIK_USER_JOLIEN_EMAIL, ""]
          type: internal
          groups:
            - !KeyOf household
