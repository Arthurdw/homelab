---
# Authentik blueprints, mounted into the server and worker by the chart (`blueprints.configMaps` in
# release.yaml) and applied by the worker. One file per app that signs in through Authentik.
#
# seafile.yaml: the OAuth2/OpenID provider and the application for Seafile (decisions.md §5.8). Seahub's side
# is the OAUTH_* block in kubernetes/apps/seafile/seafile.yaml. The client secret is the `client-secret` key of
# the Secret `authentik-seafile-oidc`, exposed to the worker as AUTHENTIK_SEAFILE_OIDC_SECRET (global.env in
# release.yaml); Seafile reads the same value from its own Secret `seafile-oidc`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
data:
  seafile.yaml: |
    version: 1
    metadata:
      name: Seafile
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: seafile-provider
        identifiers:
          name: Seafile
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: seafile
          # Authentik 2026.x refuses every grant a provider doesn't list ("Invalid grant_type for provider").
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env AUTHENTIK_SEAFILE_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://seafile.lab.ardw.be/oauth/callback/
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # Stable per-user id, so Seafile's uid survives an email change (seafile.yaml OAUTH_ATTRIBUTE_MAP).
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        id: seafile-app
        identifiers:
          slug: seafile
        attrs:
          name: Seafile
          provider: !KeyOf seafile-provider
          meta_launch_url: https://seafile.lab.ardw.be/
