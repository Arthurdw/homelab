---
# Forward-auth through Authentik's embedded outpost (docs/runbooks/sso.md, Forward-auth).
#
# One shared Middleware for every protected host. An Ingress opts in with ONE annotation:
#   traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd
# (`<namespace>-<name>@kubernetescrd`). The Ingress may live in any namespace: Traefik's
# providers.kubernetesCRD.allowCrossNamespace (false, the chart default) only gates IngressRoute -> Middleware
# references; the Ingress provider resolves this annotation without a namespace check (it would stop working if
# providers.kubernetesIngress.crossProviderNamespaces were ever set without `authentik`).
#
# Per protected host there must also be: a proxy provider (forward_single) and application in blueprints.yaml,
# listed on the embedded outpost there, and a rule for the host in the Ingress below.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
spec:
  forwardAuth:
    # The cluster Service of authentik-server (the embedded outpost runs inside it), not the Ingress.
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    # As listed in Authentik's Traefik (Kubernetes) integration docs.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
# The outpost's own endpoints (login callback, sign-out) on each protected host go straight to authentik-server,
# without the Middleware. An Ingress backend must be in its own namespace, hence this Ingress here and not in the
# app's. Traefik ranks routers by rule length, so this longer path rule wins over the app's `/` rule.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
spec:
  ingressClassName: traefik
  tls:
    # No secretName: Traefik's default TLSStore serves the *.lab.ardw.be wildcard.
    - hosts:
        - home.lab.ardw.be
  rules:
    - host: home.lab.ardw.be
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  name: http
