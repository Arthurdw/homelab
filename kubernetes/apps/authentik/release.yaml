---
# Authentik — web single sign-on (docs/architecture.md, docs/SPEC.md).
#   Chart:  authentik 2026.8.4 from https://charts.goauthentik.io (appVersion 2026.8.4, so the
#           server/worker image is ghcr.io/goauthentik/server:2026.8.4 — the chart pins it)
#
# Authentik is NEVER required to recover infrastructure: break-glass access is independent of it
# (docs/runbooks/break-glass.md, docs/secrets-and-state.md §6). Seafile, Grafana, Immich and Audiobookshelf sign
# in through it, Proxmox and Technitium have OIDC clients, Homepage sits behind its forward-auth (embedded
# outpost, forward-auth.yaml), and its user dashboard links the other homelab UIs (blueprints.yaml,
# docs/runbooks/sso.md).
#
# No Redis: authentik 2025.10+ moved its cache, tasks and websockets into PostgreSQL, and this chart no
# longer has a Redis dependency at all.
#
# SECRETS — the Secret `authentik-credentials` (namespace authentik) is created out-of-band (SOPS) and never
# committed in cleartext:
#   secret-key         cookie signing + unique IDs; long random string; NEVER change after first install
#   postgres-password  password of the `authentik` database user (bundled PostgreSQL + the app)
# Also `authentik-smtp` (relay login) and `authentik-<app>-oidc` (client-secret of each app's OIDC provider:
# seafile, grafana, immich, audiobookshelf, proxmox, technitium).
# The chart's own generated config Secret then carries only non-secret settings: `secret_key` and
# `postgresql.password` stay empty here (the chart drops empty values), and the real values are
# injected into the server and worker as env vars from `authentik-credentials`, which take precedence.
# (Not named `authentik`: the chart renders its own Secret of that name, which would collide.)
#
# EXPOSURE: only the server's HTTP Service is published, through Traefik, LAN/Tailscale only
# (docs/decisions.md §5.2). PostgreSQL is ClusterIP-only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      version: 2026.8.4
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      # One replica each and little spare memory on the small cluster: stop the old pod before starting the
      # new one (no surge pod, which cannot be scheduled and times the upgrade out). Not `type: Recreate`: the
      # live Deployments already carry a defaulted rollingUpdate block, which that type forbids.
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      # Applied to both the server and the worker Deployments.
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: postgres-password
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-smtp
              key: smtp-password
        # Client secrets of the OIDC providers, read by blueprints.yaml (!Env).
        - name: AUTHENTIK_SEAFILE_OIDC_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-seafile-oidc
              key: client-secret
        - name: AUTHENTIK_GRAFANA_OIDC_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-grafana-oidc
              key: client-secret
        - name: AUTHENTIK_IMMICH_OIDC_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-immich-oidc
              key: client-secret
        - name: AUTHENTIK_AUDIOBOOKSHELF_OIDC_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-audiobookshelf-oidc
              key: client-secret
        # Optional, so authentik still starts before the owner generated these two Secrets
        # (docs/runbooks/sso.md); until then only the Proxmox/Technitium blueprint fails to apply.
        - name: AUTHENTIK_PROXMOX_OIDC_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-proxmox-oidc
              key: client-secret
              optional: true
        - name: AUTHENTIK_TECHNITIUM_OIDC_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-technitium-oidc
              key: client-secret
              optional: true

    # Blueprints (blueprints.yaml): the chart mounts each ConfigMap under /blueprints/mounted.
    blueprints:
      configMaps:
        - authentik-blueprints

    authentik:
      # Deliberately empty: supplied from the `authentik-credentials` Secret via global.env above.
      secret_key: ""
      error_reporting:
        enabled: false
      postgresql:
        # Defaults: host `authentik-postgresql`, database + user `authentik`.
        password: ""
      # Recovery and notification mails via the shared relay (docs/decisions.md §5.1). The password
      # comes from the `authentik-smtp` Secret via global.env above.
      email:
        host: mail.a-line.be
        port: 465
        use_ssl: true   # implicit TLS on 465
        use_tls: false
        username: homelab@lab.ardw.be
        password: ""
        from: "authentik <auth@lab.ardw.be>"

    server:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          # Internal zone <app>.lab.ardw.be (docs/decisions.md §5.7), served by Technitium only.
          - auth.lab.ardw.be
        tls:
          # No secretName: Traefik's default TLSStore serves the *.lab.ardw.be wildcard.
          - hosts:
              - auth.lab.ardw.be

    worker:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi

    # Bundled PostgreSQL (Bitnami chart driving the official postgres image, as the authentik chart
    # ships it). Node-local on `local-path` (docs/decisions.md §4.3).
    # Backed up by the daily pg_dump in backup.yaml (docs/backup-matrix.md).
    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
        # Only the app user is needed; no separate `postgres` superuser password to manage.
        enablePostgresUser: false
        existingSecret: authentik-credentials
        secretKeys:
          userPasswordKey: postgres-password
      primary:
        persistence:
          enabled: true
          storageClass: local-path
          accessModes:
            - ReadWriteOnce
          size: 8Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
