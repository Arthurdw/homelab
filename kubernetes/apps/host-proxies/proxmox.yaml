---
# Proxmox web UI at https://pve.lab.ardw.be through Traefik (docs/runbooks/host-proxies.md, decisions.md §5.12).
# Break-glass, bypassing the cluster: https://poseidon.lab.ardw.be:8006/ (host record, 10.10.1.1).
#
# Selector-less Service + hand-written EndpointSlice: Traefik v3's kubernetescrd provider reads EndpointSlices
# (matched by the kubernetes.io/service-name label and the port name), and with no selector the EndpointSlice
# controller leaves this one alone.
apiVersion: v1
kind: Service
metadata:
  name: proxmox
  namespace: host-proxies
  labels:
    app.kubernetes.io/name: proxmox
    app.kubernetes.io/part-of: host-proxies
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox
  namespace: host-proxies
  labels:
    kubernetes.io/service-name: proxmox
    endpointslice.kubernetes.io/managed-by: flux
    app.kubernetes.io/name: proxmox
    app.kubernetes.io/part-of: host-proxies
addressType: IPv4
ports:
  - name: https
    port: 8006
    protocol: TCP
endpoints:
  - addresses:
      - 10.10.1.1
    # Explicit: Traefik skips endpoints that are not ready.
    conditions:
      ready: true
      serving: true
      terminating: false
---
# Verified backend TLS, no insecureSkipVerify: the only trusted root is the pinned certificate below, and the
# host's certificate must carry serverName as a SAN. No allowCrossNamespace needed: the ServersTransport, its
# ConfigMap and the IngressRoute all live in this namespace.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: proxmox
  namespace: host-proxies
  labels:
    app.kubernetes.io/name: proxmox
    app.kubernetes.io/part-of: host-proxies
spec:
  serverName: poseidon
  rootCAs:
    - configMap: proxmox-pinned-cert
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox
  namespace: host-proxies
  labels:
    app.kubernetes.io/name: proxmox
    app.kubernetes.io/part-of: host-proxies
spec:
  entryPoints:
    - websecure
  routes:
    # Internal zone <name>.lab.ardw.be (decisions.md §5.7), resolved to Traefik by Technitium's wildcard.
    # No Authentik forward-auth middleware: Proxmox has its own login.
    - kind: Rule
      match: Host(`pve.lab.ardw.be`)
      services:
        - name: proxmox
          port: https
          scheme: https
          serversTransport: proxmox
  # No secretName: Traefik's default TLSStore serves the *.lab.ardw.be wildcard (decisions.md §5.7).
  tls: {}
---
# Pinned certificate for the ServersTransport above. A public certificate, no key. pveproxy does not send its
# CA (PVE Cluster Manager CA) in the chain, so this pins poseidon's node LEAF certificate itself:
#   subject  CN=poseidon.network.control, OU=PVE Cluster Node, O=Proxmox Virtual Environment
#   issuer   CN=Proxmox Virtual Environment, O=PVE Cluster Manager CA
#   SANs     poseidon, poseidon.network.control, localhost, 10.10.1.1, 127.0.0.1, ::1
#   expires  2028-10-19 (notAfter Oct 19 16:02:40 2028 GMT)
# PVE renews the node certificate on its own before expiry, and a reinstall or `pvecm updatecerts -f` replaces
# it; any of these breaks this route (502) until the pin is refreshed. Refresh (read-only):
#   openssl s_client -connect 10.10.1.1:8006 -showcerts </dev/null | openssl x509
# and paste the PEM below. Longer-lived alternative: pin the CA instead (/etc/pve/pve-root-ca.pem on poseidon,
# also public, valid ~10 years), which survives node-certificate renewals.
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxmox-pinned-cert
  namespace: host-proxies
  labels:
    app.kubernetes.io/name: proxmox
    app.kubernetes.io/part-of: host-proxies
