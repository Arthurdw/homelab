---
# TrueNAS web UI at https://nas.lab.ardw.be through Traefik (docs/runbooks/host-proxies.md, decisions.md §5.12).
# Break-glass, bypassing the cluster: https://hercules-nas.lab.ardw.be/ (host record, 10.10.1.10).
#
# Selector-less Service + hand-written EndpointSlice: Traefik v3's kubernetescrd provider reads EndpointSlices
# (matched by the kubernetes.io/service-name label and the port name), and with no selector the EndpointSlice
# controller leaves this one alone.
apiVersion: v1
kind: Service
metadata:
  name: truenas
  namespace: host-proxies
  labels:
    app.kubernetes.io/name: truenas
    app.kubernetes.io/part-of: host-proxies
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas
  namespace: host-proxies
  labels:
    kubernetes.io/service-name: truenas
    endpointslice.kubernetes.io/managed-by: flux
    app.kubernetes.io/name: truenas
    app.kubernetes.io/part-of: host-proxies
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 10.10.1.10
    # Explicit: Traefik skips endpoints that are not ready.
    conditions:
      ready: true
      serving: true
      terminating: false
---
# Verified backend TLS, no insecureSkipVerify: the only trusted root is the pinned certificate below, and the
# host's certificate must carry serverName as a SAN. No allowCrossNamespace needed: the ServersTransport, its
# ConfigMap and the IngressRoute all live in this namespace.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: truenas
  namespace: host-proxies
  labels:
    app.kubernetes.io/name: truenas
    app.kubernetes.io/part-of: host-proxies
spec:
  serverName: localhost
  rootCAs:
    - configMap: truenas-pinned-cert
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas
  namespace: host-proxies
  labels:
    app.kubernetes.io/name: truenas
    app.kubernetes.io/part-of: host-proxies
spec:
  entryPoints:
    - websecure
  routes:
    # Internal zone <name>.lab.ardw.be (decisions.md §5.7), resolved to Traefik by Technitium's wildcard.
    # No Authentik forward-auth middleware: TrueNAS has its own login.
    - kind: Rule
      match: Host(`nas.lab.ardw.be`)
      services:
        - name: truenas
          port: https
          scheme: https
          serversTransport: truenas
  # No secretName: Traefik's default TLSStore serves the *.lab.ardw.be wildcard (decisions.md §5.7).
  tls: {}
---
# Pinned certificate for the ServersTransport above. A public certificate, no key. TrueNAS's default
# self-signed certificate, so the leaf is its own root:
#   subject  CN=localhost, O=iXsystems (self-signed)
#   SANs     localhost
#   expires  2027-11-22 (notAfter Nov 22 11:07:59 2027 GMT)
# When TrueNAS regenerates it (expiry, reinstall, or a new UI certificate chosen in System > Certificates), this
# route breaks (502) until the pin is refreshed. Refresh (read-only):
#   openssl s_client -connect 10.10.1.10:443 -showcerts </dev/null | openssl x509
# and paste the PEM below; if the new certificate's SAN is not `localhost`, change serverName above to match.
apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-pinned-cert
  namespace: host-proxies
  labels:
    app.kubernetes.io/name: truenas
    app.kubernetes.io/part-of: host-proxies
