---
# Immich database backups: a scheduled pg_dump written to the NAS (decisions.md §4.3).
# Media and database are one recovery set (docs/apps/immich.md): restore the dump together with the
# media library on `nas-nfs`. Credentials come from the SOPS-encrypted Secret `immich-db`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-backups
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-db-dump
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: immich
spec:
  # Daily at 03:17 (cluster time is UTC).
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # postgres uid/gid. TODO(storage): confirm the `nas-nfs` export accepts uid/gid 999.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # Same image as the database (provides pg_dump).
              image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  # `$${...}` escapes Flux postBuild substitution; brace-less `$VAR` is left alone.
                  out="/backups/immich-$${ts}.dump"
                  # Dump to a name the retention glob and the restore test ignore, so a pg_dump that
                  # dies half way never leaves a truncated `.dump` that looks like the newest backup.
                  tmp="$out.partial"
                  trap 'rm -f "$tmp"' EXIT
                  prev="$(ls -1t /backups/immich-*.dump 2>/dev/null | head -n 1 || true)"
                  pg_dump --format=custom --no-owner --no-privileges \
                    --host="$PGHOST" --username="$PGUSER" --dbname="$PGDATABASE" \
                    --file="$tmp"
                  mv "$tmp" "$out"
                  echo "wrote $${out}"
                  # Size anomaly: a dump far smaller than the previous one means data went missing
                  # (or the dump is silently incomplete). Fail the Job, so DatabaseBackupJobFailed
                  # alerts. The dump is kept as `.suspect` for inspection, not as a restore point,
                  # and the next run still compares against the last good dump.
                  if [ -n "$prev" ]; then
                    size="$(stat -c %s "$out")"
                    prev_size="$(stat -c %s "$prev")"
                    if [ $((size * 100)) -lt $((prev_size * DUMP_MIN_PERCENT)) ]; then
                      mv "$out" "$out.suspect"
                      echo "SIZE ANOMALY: $${size} bytes is under $${DUMP_MIN_PERCENT}% of the previous dump ($${prev_size} bytes, $prev)" >&2
                      ls -1t /backups/immich-*.suspect | tail -n +4 | xargs -r rm -f
                      exit 1
                    fi
                  fi
                  # Keep the 14 most recent dumps.
                  ls -1t /backups/immich-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
              env:
                # Fail the Job when a dump is smaller than this percentage of the previous one.
                - name: DUMP_MIN_PERCENT
                  value: "50"
                - name: PGHOST
                  value: immich-postgres
                - name: PGDATABASE
                  value: immich
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: immich-db
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: immich-db-backups
