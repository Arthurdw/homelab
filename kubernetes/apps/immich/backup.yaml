---
# Immich database backups — scheduled logical dumps (pg_dump) written to the NAS.
#
# decisions.md §4.3: the live database stays on the node SSD, but a *logical dump* runs on a schedule
# and lands on the NAS, giving consistent, restorable copies that survive node loss.
#
# IMPORTANT: media and database are ONE recovery set (docs/apps/immich.md). The dump alone is not a
# backup of Immich — it must be restored together with the media library on `nas-nfs`.
#
# The password/username come from the SOPS-encrypted Secret `immich-db` (NOT created here).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-backups
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-db-dump
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: immich
spec:
  # Daily at 03:17 UTC (offset from other jobs; TZ of the cluster is UTC).
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # Write as the postgres uid so the dump is readable by the database's own tooling and does
          # not depend on NFS root-squash being disabled. The NFS export/PVC must permit this uid —
          # TODO(storage): confirm `nas-nfs` export permissions accept uid/gid 999 (or apply fsGroup).
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # Same image as the database (postgres 14 + `pg_dump` on PATH).
              image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
              imagePullPolicy: IfNotPresent
              # `command` replaces the image entrypoint, so this runs a plain shell (not postgres).
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backups/immich-${ts}.dump"
                  pg_dump --format=custom --no-owner --no-privileges \
                    --host="$PGHOST" --username="$PGUSER" --dbname="$PGDATABASE" \
                    --file="$out"
                  echo "wrote ${out}"
                  # Retain the 14 most recent dumps (the NAS snapshot policy covers longer term).
                  ls -1t /backups/immich-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
              env:
                - name: PGHOST
                  value: immich-postgres
                - name: PGDATABASE
                  value: immich
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: immich-db
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db
                      key: password
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: immich-db-backups
