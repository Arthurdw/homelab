---
# Immich database backups: a scheduled pg_dump written to the NAS (decisions.md §4.3).
# Media and database are one recovery set (docs/apps/immich.md): restore the dump together with the
# media library on `nas-nfs`. Credentials come from the SOPS-encrypted Secret `immich-db`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-backups
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-db-dump
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: immich
spec:
  # Daily at 03:17 (cluster time is UTC).
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # postgres uid/gid. TODO(storage): confirm the `nas-nfs` export accepts uid/gid 999.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # Same image as the database (provides pg_dump).
              image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  # `$${...}` escapes Flux postBuild substitution; brace-less `$VAR` is left alone.
                  out="/backups/immich-$${ts}.dump"
                  pg_dump --format=custom --no-owner --no-privileges \
                    --host="$PGHOST" --username="$PGUSER" --dbname="$PGDATABASE" \
                    --file="$out"
                  echo "wrote $${out}"
                  # Keep the 14 most recent dumps.
                  ls -1t /backups/immich-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
              env:
                - name: PGHOST
                  value: immich-postgres
                - name: PGDATABASE
                  value: immich
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: immich-db
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db
                      key: password
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: immich-db-backups
