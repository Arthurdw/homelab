---
# Immich database — PostgreSQL 16 + VectorChord + pgvecto.rs + pgvector.
#
# Immich v3.x requires VectorChord; the upstream chart removed its postgres subchart and expects an
# external instance. This is a plain single-replica StatefulSet using the *exact* image Immich itself
# pins in `docker/docker-compose.yml`, so the required extensions are present.
#
# WHY LOCAL: decisions.md §4.3 — latency-sensitive databases stay off network storage. The data volume
# is a `local-path` PV on the node SSD; consistent copies go to the NAS as logical dumps (backup.yaml).
#
# The password/username are read from the SOPS-encrypted Secret `immich-db` (NOT created here).
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-postgres
    app.kubernetes.io/part-of: immich
spec:
  # Headless: a single StatefulSet pod is addressed directly by DNS.
  clusterIP: None
  selector:
    app.kubernetes.io/name: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-postgres
    app.kubernetes.io/part-of: immich
spec:
  serviceName: immich-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-postgres
        app.kubernetes.io/part-of: immich
    spec:
      # The image's entrypoint (a thin wrapper over the official postgres entrypoint) edits
      # /etc/postgresql/*.conf before dropping privileges to the `postgres` user, so the *container*
      # starts as root — exactly as in the upstream docker-compose. `fsGroup` makes the freshly
      # provisioned volume group-writable for that drop.
      # TODO(hardening): prove running as uid 999 by pre-seeding /etc/postgresql, then set runAsNonRoot.
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Username/database mirror the values in release.yaml (DB_USERNAME / DB_DATABASE_NAME).
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            # One subdirectory per major: a new major starts in an empty directory beside the old
            # one, and the data moves across by dump and restore (docs/apps/immich.md §Upgrade). A
            # new binary refuses the old files, so bump this together with the image tag. The PG14
            # files at the volume root are the copy from before 16; the owner deletes them later.
            - name: PGDATA
              value: /var/lib/postgresql/data/pg16
            - name: TZ
              value: Etc/UTC
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -q
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -q
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        # postgres wants a decent /dev/shm; default 64Mi is too small for larger queries.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
