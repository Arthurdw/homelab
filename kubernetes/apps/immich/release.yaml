---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # TODO(GATE 0) — must be filled before this is applied:
  #   - image tag to match the chart/servers
  #   - persistence: library + PostgreSQL data on the chosen storage class / existing claims
  #   - DB + Redis connection (or chart-managed) and the DB backup path
  #   - an Ingress/TLS host under the internal domain (see docs/network-plan.md)
  #   - secrets (DB password, etc.) via SOPS-encrypted manifests
  values: {}
