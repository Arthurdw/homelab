---
# Pod Security: Ollama and Open WebUI both run non-root with a read-only root filesystem, so they fit `restricted`;
# `baseline` is enforced like the other app namespaces and `restricted` is warned/audited.
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
