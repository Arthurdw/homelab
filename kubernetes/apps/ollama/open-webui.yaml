---
# Open WebUI (docs/runbooks/ollama.md, decisions.md §5.18): the chat page for Ollama at chat.lab.ardw.be, and where
# models are pulled and deleted (Admin Panel → Settings → Models).
#
# LOGIN: Authentik forward-auth in front (any Authentik user, like Home). Open WebUI takes the user from the
# X-authentik-email and X-authentik-name headers the Middleware sets, and creates the account on the first visit:
# the very first one becomes admin, later ones get DEFAULT_USER_ROLE. Only Traefik may reach the pod
# (networkpolicy.yaml), so nobody can send those headers themselves. ENABLE_SIGNUP and ENABLE_LOGIN_FORM stay on:
# the header login goes through the same signup code and is refused when either is off.
#
# STORAGE: the SQLite database (users, chats, settings) and the embedding model on the node SSD (`local-path`,
# decisions.md §4.3). Not backed up: losing it loses chat history and settings, nothing else.
#
# Runs as uid 1000 (the image defaults to root) with no capabilities and a read-only root. At start it copies its
# icons and loader into STATIC_DIR, which in the image is read-only, so that points into /tmp. Verified locally
# with docker on 2026-10-31.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: ollama
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: ollama
spec:
  replicas: 1
  # RWO volume and a SQLite database: stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/part-of: ollama
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          # versions.yaml app_images.open_webui
          image: ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: WEBUI_URL
              value: https://chat.lab.ardw.be
            # Generated by the start script on the first start, kept on the volume so sessions survive restarts.
            - name: WEBUI_SECRET_KEY_FILE
              value: /app/backend/data/.webui_secret_key
            - name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
              value: X-authentik-email
            - name: WEBUI_AUTH_TRUSTED_NAME_HEADER
              value: X-authentik-name
            # Open WebUI's sign-out also ends the Authentik session; otherwise the header logs straight back in.
            - name: WEBUI_AUTH_SIGNOUT_REDIRECT_URL
              value: https://chat.lab.ardw.be/outpost.goauthentik.io/sign_out
            # Read on the first start only; after that the admin settings in the database win.
            - name: DEFAULT_USER_ROLE
              value: user
            - name: WEBUI_SESSION_COOKIE_SECURE
              value: "true"
            - name: ENABLE_OPENAI_API
              value: "false"
            - name: ENABLE_VERSION_UPDATE_CHECK
              value: "false"
            - name: HOME
              value: /tmp
            - name: STATIC_DIR
              value: /tmp/static
          # The first start downloads the embedding model (sentence-transformers/all-MiniLM-L6-v2) into the
          # volume, about 0.9 GB of cache: 48 s locally, so up to 10 min here.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: ollama
spec:
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: ollama
  annotations:
    # Authentik forward-auth (kubernetes/apps/authentik/forward-auth.yaml). The outpost's own paths on this host
    # are routed by the Ingress `authentik-outpost` in the authentik namespace.
    traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    # Internal zone <app>.lab.ardw.be (decisions.md §5.7), served by Technitium only.
    - host: chat.lab.ardw.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  name: http
  # TLS on websecure with NO secretName: Traefik serves its default TLSStore certificate, the
  # *.lab.ardw.be wildcard (decisions.md §5.7).
  tls:
    - hosts:
        - chat.lab.ardw.be
