---
# Pod Security: the Seafile all-in-one image runs as root by default (NON_ROOT=true would need the NFS
# export to accept uid 8000), which `baseline` allows. Warn/audit against `restricted` keeps the gap visible.
apiVersion: v1
kind: Namespace
metadata:
  name: seafile
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
