---
# SeaDoc (sdoc-server): the editor backend for Seafile's .sdoc documents, which is what every Wiki page is.
# Without it Seahub falls back to its built-in SEADOC_SERVER_URL default, http://127.0.0.1:7070, and the
# browser's wiki and sdoc requests fail. This follows the official "Deploy SeaDoc standalone" setup for 14.0
# (https://manual.seafile.com/14.0/extension/setup_seadoc/, its seadoc.yml), which still ships the 2.0 line.
#
# How it fits together:
# - The browser talks to it at https://files.ardw.be/sdoc-server/ (prefix stripped) and opens a websocket at
#   https://files.ardw.be/socket.io/ (path kept), both through the Ingress below. seafile.yaml points Seahub at
#   it with ENABLE_SEADOC and SEADOC_SERVER_URL.
# - It calls Seahub back in-cluster at http://seafile (the Service), signing with the same JWT key as Seahub,
#   and keeps its operation log in seahub_db (table sdoc_operation_log, cleaned automatically).
# - /shared holds only its logs, so an emptyDir is enough: documents live in Seafile itself.
#
# EXPOSURE: LAN only for now. The Cloudflare Tunnel (kubernetes/apps/cloudflared) does not pass /sdoc-server or
# /socket.io, so an .sdoc file opened from a public share link does not render from the internet. Adding those
# paths is a public-exposure change and needs the owner's review first (GATE 7, decisions.md §5.13).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seadoc
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/component: seadoc
    app.kubernetes.io/part-of: seafile
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seafile
      app.kubernetes.io/component: seadoc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seafile
        app.kubernetes.io/component: seadoc
        app.kubernetes.io/part-of: seafile
    spec:
      containers:
        - name: seadoc
          # versions.yaml app_images.seafile_seadoc
          image: docker.io/seafileltd/sdoc-server:2.0.9@sha256:5b1bf5a8bfdb8bc5db957e7faee2220111fd6eff00795eaaf172e2f80bb999a5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: TIME_ZONE
              value: Europe/Brussels
            - name: DB_HOST
              value: seafile-mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: seafile
            - name: DB_NAME
              value: seahub_db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-db
                  key: password
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile-jwt
                  key: jwt-private-key
            - name: SEAHUB_SERVICE_URL
              value: http://seafile
            # Runs as root like the Seafile image (namespace.yaml); NON_ROOT=true is untested here.
            - name: NON_ROOT
              value: "false"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seadoc
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/component: seadoc
    app.kubernetes.io/part-of: seafile
spec:
  selector:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/component: seadoc
  ports:
    - name: http
      port: 80
      targetPort: http
---
# sdoc-server serves from its root, so /sdoc-server is stripped. /socket.io does not match the prefix and
# passes through unchanged, as the official proxy config does.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: seadoc-strip-prefix
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/component: seadoc
    app.kubernetes.io/part-of: seafile
spec:
  stripPrefix:
    prefixes:
      - /sdoc-server
---
# Same host as the `seafile` Ingress (seafile.yaml); Traefik ranks the longer path rules above its `/`.
# Websockets need no extra settings in Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seadoc
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/component: seadoc
    app.kubernetes.io/part-of: seafile
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: seafile-seadoc-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: files.ardw.be
      http:
        paths:
          - path: /sdoc-server
            pathType: Prefix
            backend:
              service:
                name: seadoc
                port:
                  name: http
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: seadoc
                port:
                  name: http
  tls:
    - hosts:
        - files.ardw.be
      secretName: files-ardw-be-tls
