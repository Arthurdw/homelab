---
# Seafile Community Edition (decisions.md §5.8): the official all-in-one seafile-mc image, i.e. nginx, Seahub
# and the file server in one container, on top of MariaDB and memcached (mariadb.yaml). There is no Helm
# chart, so this is plain manifests; the image is pinned in versions.yaml (app_images.seafile).
#
# DATA: /shared (blocks, config) on the NAS over NFS (StorageClass `nas-nfs`, decisions.md §4.1), like the
# Immich library. Logs go to stdout (`kubectl logs`); anything still written to /shared/seafile/logs lands on an
# emptyDir. On the NAS those few lines every few seconds kept all 8 HDDs seeking (decisions.md §4.6).
# TODO(storage): the decision puts this on its own dataset `main/apps/seafile`, but
# `nas-nfs` serves one export (`main/k8s`) with a per-PVC subdirectory. To land on `main/apps/seafile`, the
# TrueNAS side must export that dataset and a static PV (or a second StorageClass) must point at it.
#
# The first start generates /shared/seafile/conf from the env below (admin, DB, hostname). After that the
# files win: changing SEAFILE_* env later does not rewrite them, edit /shared/seafile/conf instead.
#
# SECRETS (kubernetes/overlays/homelab/README.md): `seafile-db` (root-password, password), `seafile-admin`
# (email, password), `seafile-jwt` (jwt-private-key, never change it after the first install),
# `seafile-smtp` (smtp-password), `seafile-oidc` (client-secret).
#
# MAIL: the image has no EMAIL_* env vars; settings only come from Python. Seahub imports
# `seahub.local_settings` before conf/seahub_settings.py, so the ConfigMap below is mounted there and reads the
# relay password from the environment. That keeps the password out of git. The mount path contains the
# Seafile version (14.0.9): bump it together with the image tag.
#
# SIGN-IN: web sign-in goes through Authentik OIDC (decisions.md §5.8): the ConfigMap enables OAUTH_* with the
# client `seafile`, declared by the Authentik blueprint (kubernetes/apps/authentik/blueprints.yaml). The client
# secret is the Secret `seafile-oidc` (client-secret), the same value as Authentik's `authentik-seafile-oidc`.
# Local login stays enabled, so the admin created from `seafile-admin` always works. Desktop and mobile clients
# keep their own tokens. Seahub itself fetches the token and userinfo from Authentik, so auth.lab.ardw.be must
# resolve from the pod and its certificate must be trusted (it is, with the public wildcard in production).
#
# EXPOSURE (decisions.md §5.13): the canonical name is files.ardw.be. On the LAN it resolves to Traefik (an
# internal Technitium zone plus a UDM Forward Domain) and serves everything, sign-in included. From the internet
# the same name goes through the Cloudflare Tunnel (kubernetes/apps/cloudflared), which passes ONLY the
# share-link and upload-link paths. seafile.lab.ardw.be permanently redirects to files.ardw.be.
#
# Behind the tunnel the client IP Seahub logs (first X-Forwarded-For entry) is client-controlled: treat it as
# untrusted in logs and audit entries. Share-link password checks are not rate limited by Seahub, hence the
# long minimum for the optional passwords below (docs/runbooks/public-shares.md).
#
# WIKIS AND .sdoc FILES need SeaDoc (seadoc.yaml): ENABLE_SEADOC and SEADOC_SERVER_URL below point Seahub at it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-data
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: seafile
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-nfs
  resources:
    requests:
      # Initial reservation, grow once the real size is known.
      storage: 200Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seafile-local-settings
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/part-of: seafile
data:
  local_settings.py: |
    # Mounted at seahub/local_settings.py (see seafile.yaml). The relay password is read from the env.
    import os

    EMAIL_USE_SSL = True
    EMAIL_USE_TLS = False
    EMAIL_HOST = "mail.a-line.be"
    EMAIL_PORT = 465
    EMAIL_HOST_USER = "homelab@lab.ardw.be"
    EMAIL_HOST_PASSWORD = os.environ.get("SEAFILE_SMTP_PASSWORD", "")
    DEFAULT_FROM_EMAIL = "seafile@lab.ardw.be"
    SERVER_EMAIL = "seafile@lab.ardw.be"

    # Sign-in through Authentik (client `seafile`, authentik blueprints.yaml). The uid is the email address.
    ENABLE_OAUTH = True
    OAUTH_CLIENT_ID = "seafile"
    OAUTH_CLIENT_SECRET = os.environ.get("SEAFILE_OIDC_SECRET", "")
    # The Authentik client also keeps the old seafile.lab.ardw.be callback (blueprints.yaml).
    OAUTH_REDIRECT_URL = "https://files.ardw.be/oauth/callback/"
    OAUTH_PROVIDER_DOMAIN = "auth.lab.ardw.be"
    OAUTH_AUTHORIZATION_URL = "https://auth.lab.ardw.be/application/o/authorize/"
    OAUTH_TOKEN_URL = "https://auth.lab.ardw.be/application/o/token/"
    OAUTH_USER_INFO_URL = "https://auth.lab.ardw.be/application/o/userinfo/"
    OAUTH_SCOPE = ["openid", "profile", "email"]
    # Seafile 11+ keys users on "uid". Authentik's userinfo has no "uid" claim, so its stable "sub" fills it;
    # the email becomes the contact address, so a changed email doesn't orphan the account.
    OAUTH_ATTRIBUTE_MAP = {
        "sub": (True, "uid"),
        "name": (False, "name"),
        "email": (False, "contact_email"),
    }

    # Share and upload links can be opened from the internet (decisions.md §5.13). Password and expiry are
    # the sharer's choice per link (owner decision 2026-10-22): a link without either is as safe as its
    # random token. When a password is set, Seahub does not throttle wrong guesses, so it must be 12+
    # characters from at least two character classes (digits, upper, lower, symbols).
    # The first three are also editable in the admin UI (Settings, stored in the database by Constance):
    # once saved there, the database value wins over this file.
    SHARE_LINK_FORCE_USE_PASSWORD = False
    SHARE_LINK_PASSWORD_MIN_LENGTH = 12
    SHARE_LINK_PASSWORD_STRENGTH_LEVEL = 2
    # Expiry is optional only when MIN, MAX and DEFAULT are all 0: any non-zero value makes Seahub's link
    # dialog force the expiry box on (isExpireDaysNoLimit in Seahub 14's link-creation.js and
    # generate-upload-link.js), and the API applies DEFAULT to links created without an expiry.
    SHARE_LINK_EXPIRE_DAYS_MIN = 0
    SHARE_LINK_EXPIRE_DAYS_DEFAULT = 0
    SHARE_LINK_EXPIRE_DAYS_MAX = 0
    UPLOAD_LINK_EXPIRE_DAYS_MIN = 0
    UPLOAD_LINK_EXPIRE_DAYS_DEFAULT = 0
    UPLOAD_LINK_EXPIRE_DAYS_MAX = 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: seafile
spec:
  replicas: 1
  # /shared holds one set of config and a single-writer fileserver: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seafile
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seafile
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: seafile
    spec:
      containers:
        - name: seafile
          # versions.yaml app_images.seafile
          image: docker.io/seafileltd/seafile-mc:14.0.9@sha256:75d8b88e8bfaa54099082aec0e99ff1a962bd364bfc21da34125fa66998f0861
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: TIME_ZONE
              value: Europe/Brussels
            # Seahub derives SERVICE_URL and FILE_SERVER_ROOT (download and upload URLs) from these two at
            # every start, so this env wins over conf/ for those (decisions.md §5.13).
            - name: SEAFILE_SERVER_HOSTNAME
              value: files.ardw.be
            - name: SEAFILE_SERVER_PROTOCOL
              value: https
            # SeaDoc (seadoc.yaml). Unset, Seahub sends the browser to its default http://127.0.0.1:7070.
            - name: ENABLE_SEADOC
              value: "true"
            - name: SEADOC_SERVER_URL
              value: https://files.ardw.be/sdoc-server
            - name: CSRF_TRUSTED_ORIGINS
              value: '["https://files.ardw.be","https://seafile.lab.ardw.be"]'
            - name: SEAFILE_MYSQL_DB_HOST
              value: seafile-mariadb
            - name: SEAFILE_MYSQL_DB_PORT
              value: "3306"
            - name: SEAFILE_MYSQL_DB_USER
              value: seafile
            - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
              value: ccnet_db
            - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
              value: seafile_db
            - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
              value: seahub_db
            - name: SEAFILE_MYSQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-db
                  key: password
            - name: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-db
                  key: root-password
            - name: INIT_SEAFILE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: seafile-admin
                  key: email
            - name: INIT_SEAFILE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-admin
                  key: password
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile-jwt
                  key: jwt-private-key
            # Seahub, the file server and seafevents log to stdout instead of /shared/seafile/logs (official
            # compose: SEAFILE_LOG_TO_STDOUT, default false).
            - name: SEAFILE_LOG_TO_STDOUT
              value: "true"
            - name: CACHE_PROVIDER
              value: memcached
            - name: MEMCACHED_HOST
              value: seafile-memcached
            - name: MEMCACHED_PORT
              value: "11211"
            - name: SEAFILE_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-smtp
                  key: smtp-password
            - name: SEAFILE_OIDC_SECRET
              valueFrom:
                secretKeyRef:
                  name: seafile-oidc
                  key: client-secret
          # First start creates the databases and the config: allow up to ~10 minutes before liveness applies.
          startupProbe:
            httpGet:
              path: /api2/ping/
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api2/ping/
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api2/ping/
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /shared
            # The image's own scripts (enterpoint.log, seafile-monitor.log) still write files here. Lost on a
            # restart, which is fine for logs; the old files on the NAS are only hidden, not deleted.
            - name: logs
              mountPath: /shared/seafile/logs
            - name: local-settings
              mountPath: /opt/seafile/seafile-server-14.0.9/seahub/seahub/local_settings.py
              subPath: local_settings.py
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seafile-data
        # Capped so a runaway log cannot fill the node disk; past the cap the kubelet evicts the pod, and the
        # restart starts with an empty directory.
        - name: logs
          emptyDir:
            sizeLimit: 512Mi
        - name: local-settings
          configMap:
            name: seafile-local-settings
---
apiVersion: v1
kind: Service
metadata:
  name: seafile
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: seafile
spec:
  selector:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Certificate for files.ardw.be (Let's Encrypt DNS-01 on homelab; the ClusterIssuers' solver selector lists
# files.ardw.be). It is outside the *.lab.ardw.be wildcard, so the Ingress below references it by secretName.
# Only LAN clients see it: the internet reaches files.ardw.be through Cloudflare's edge certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: files-ardw-be
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/part-of: seafile
spec:
  secretName: files-ardw-be-tls
  dnsNames:
    - files.ardw.be
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: ${CLUSTER_ISSUER}
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seafile
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/part-of: seafile
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    # LAN only: files.ardw.be resolves to Traefik through the internal Technitium zone (bootstrap-zone.yaml).
    - host: files.ardw.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seafile
                port:
                  name: http
  tls:
    - hosts:
        - files.ardw.be
      secretName: files-ardw-be-tls
---
# The old name redirects permanently (301 for GET, 308 otherwise), path and query kept. Bookmarks keep working;
# desktop and mobile clients should be re-pointed at https://files.ardw.be (docs/runbooks/public-shares.md).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-files
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/part-of: seafile
spec:
  redirectRegex:
    regex: ^https?://seafile\.lab\.ardw\.be/(.*)
    # Brace-less $1: Flux postBuild only substitutes `${`.
    replacement: https://files.ardw.be/$1
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seafile-redirect
  namespace: seafile
  labels:
    app.kubernetes.io/name: seafile
    app.kubernetes.io/part-of: seafile
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: seafile-redirect-to-files@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    # Internal zone <app>.lab.ardw.be (decisions.md §5.7), served by Technitium only.
    - host: seafile.lab.ardw.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seafile
                port:
                  name: http
  # TLS on websecure with NO secretName: Traefik serves its default TLSStore certificate, the
  # *.lab.ardw.be wildcard (decisions.md §5.7).
  tls:
    - hosts:
        - seafile.lab.ardw.be
