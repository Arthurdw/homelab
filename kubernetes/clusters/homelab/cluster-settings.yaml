---
# Per-cluster settings for `homelab` (production). Substituted into the shared tree
# (kubernetes/infrastructure, kubernetes/apps) via each Kustomization's postBuild.substituteFrom.
# An undefined ${VAR} becomes an empty string, so scripts/ci/check-cluster-settings.sh checks that
# this and the lab ConfigMap define the same keys and that every used variable is defined.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # MetalLB L2 address pool on the K8s VLAN (docs/decisions.md §2.1, §2.6:
  # nodes 10.20.0.11-29, pool 10.20.0.100-199).
  METALLB_POOL: 10.20.0.100-10.20.0.199
  # NAS NFS server over the dedicated 10 GbE storage link, which each node joins with a second NIC
  # (docs/decisions.md §2.2: 10.99.0.0/29, Proxmox .1, NAS .2, talos-cp-1 .3, talos-wk-1 .4,
  # talos-wk-2 .5).
  NFS_SERVER: 10.99.0.2
  # Fixed LoadBalancer addresses from the start of the MetalLB pool (a proposal, not yet in decisions.md):
  # Traefik is where every *.lab.ardw.be split-horizon record points; Technitium is the internal resolver.
  TRAEFIK_LB_IP: 10.20.0.100
  TECHNITIUM_LB_IP: 10.20.0.101
  # ClusterIssuer for the *.lab.ardw.be wildcard (docs/decisions.md §5.7): Let's Encrypt DNS-01 via Cloudflare.
  CLUSTER_ISSUER: letsencrypt-production
  # Physical hosts that get an A record <name>.lab.ardw.be in Technitium (bootstrap-zone.yaml), as
  # space-separated name=ip pairs: Proxmox, TrueNAS and the UDM on the home network
  # (docs/network-plan.md). Names are the machines' own hostnames, unique across sites, so a later
  # multi-site setup (shared UniFi network with family sites, NAS-to-NAS replication) can add other
  # sites' hosts without renaming; per-site subdomains can come later.
  HOST_RECORDS: "poseidon=10.10.1.1 hercules-nas=10.10.1.10 unifi=10.0.0.1"
  # node-exporter on the Proxmox host, on its management address (infrastructure/environments/homelab/proxmox/
  # host-metrics.tf), scraped by infrastructure/configs/proxmox-host-scrapeconfig.yaml. The gateway must allow
  # the K8s VLAN to reach it (docs/runbooks/gpu-fan-control.md).
  PROXMOX_HOST_METRICS: "10.10.1.1:9100"
