---
# The TalosUpgrade and KubernetesUpgrade targets (kubernetes/upgrades/plans). Merging a version change
# there upgrades the cluster. Separate from `upgrades` because these are instances of the CRDs that
# release installs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: upgrade-plans
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/upgrades/plans
  prune: true
  # No wait: a plan is Ready only when its upgrade completes, which can take far longer than the timeout.
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: upgrades
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # ${VAR} values come from cluster-settings.yaml.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
