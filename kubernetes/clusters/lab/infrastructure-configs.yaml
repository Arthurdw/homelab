---
# Configs: resources that depend on CRDs installed by the infrastructure controllers.
# Kept separate so Flux can order them with `dependsOn` (controllers must be healthy first).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/infrastructure/configs
  prune: true
  # No wait: the ACME ClusterIssuers stay not-Ready until the Cloudflare token (and a real ACME email)
  # exist, and on the lab they never will. Waiting would stall this Kustomization and, through
  # dependsOn, `apps` with it. Apps don't need an issued cert: Traefik serves its default cert until
  # the wildcard Certificate is Ready.
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # ${VAR} values come from cluster-settings.yaml.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
