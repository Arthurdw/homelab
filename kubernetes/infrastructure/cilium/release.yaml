---
# Cilium CNI with kube-proxy replacement (docs/decisions.md §3.3; docs/architecture.md §6).
#
# - Pod/service CIDRs (10.244.0.0/16, 10.96.0.0/12) come from the Talos machine config, so
#   ipam.mode is `kubernetes`: Cilium reads each node's podCIDR instead of allocating its own.
# - Talos guide "Without kube-proxy" (https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium):
#   Talos mounts cgroup2 itself (autoMount off, hostRoot /sys/fs/cgroup) and forbids kernel modules,
#   so the agent capability list drops SYS_MODULE.
# - k8sServiceHost=localhost:7445 is KubePrism, present on every Talos node. Talos' own kube-proxy is
#   disabled in talos/patches/controlplane.yaml.
# - bpf.masquerade=false: the Talos guide lists true + forwardKubeDNSToHost (Talos default) as
#   breaking CoreDNS.
# - Hubble off and operator.replicas=1: single worker, RAM-constrained host (architecture.md §1).
# - Runs in its own `cilium` namespace (privileged Pod Security, see namespace.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: 1.20.3
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    bpf:
      masquerade: false
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # The Talos guide's list: the chart default additionally has SYS_MODULE.
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    hubble:
      enabled: false
      relay:
        enabled: false
      ui:
        enabled: false
    operator:
      replicas: 1
