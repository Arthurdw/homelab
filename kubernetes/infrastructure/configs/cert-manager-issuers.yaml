---
# cert-manager ClusterIssuers (docs/decisions.md §5.7).
#
#   letsencrypt-production / letsencrypt-staging — the DEFAULT on homelab: Let's Encrypt via DNS-01
#     through Cloudflare. DNS-01 is forced, not preferred: nothing here is reachable from the internet
#     (§5.2), so HTTP-01 has no path in. Staging exists to debug issuance without burning the
#     production rate limits; switch `CLUSTER_ISSUER` to it temporarily, never permanently.
#   internal-ca — the FALLBACK: a self-signed root kept in-cluster, for anything that must not depend on
#     Cloudflare. The lab cluster uses it (CLUSTER_ISSUER=internal-ca) so it never needs the token.
#
# Which issuer a cluster uses is chosen by `${CLUSTER_ISSUER}` in its cluster-settings, not here: all
# issuers exist on every cluster, so switching is a one-line settings change.
#
# Lives under infrastructure/configs: the cert-manager.io CRDs are installed BY the
# cert-manager HelmRelease, so these CRs are only applied after the controllers are healthy.
#
# SECRETS (not in git, owner-provided, SOPS-encrypted per cluster):
#   cert-manager/cloudflare-api-token, key `api-token` — a Cloudflare API token scoped to
#   Zone → DNS → Edit on the ardw.be zone only. Without it the ACME issuers stay not-Ready and only
#   internal-ca works; that is the intended lab behaviour.

# --- internal CA chain: selfsigned-bootstrap → internal-ca root Certificate → internal-ca ----------

# Bootstrap issuer: only used to self-sign the internal CA root below. Nothing else should reference it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
# The internal CA root. A ClusterIssuer of type `ca` reads its keypair from the cluster resource
# namespace — `cert-manager` by default — so the Certificate (and its Secret) must live there.
# cert-manager generates and renews the keypair itself; it is never committed.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab internal CA
  secretName: internal-ca-keypair
  # Long-lived on purpose: re-rooting means re-trusting on every device that installed the root.
  duration: 87600h  # 10 years
  renewBefore: 8760h  # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
    # Keep the key across renewals so a renewed root stays the same trust anchor.
    rotationPolicy: Never
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca-keypair

# --- Let's Encrypt, DNS-01 via Cloudflare --------------------------------------------------------
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # ACME contact for expiry/revocation notices (the owner's choice, 2026-10-21).
    email: dev@arthurdw.com
    # Account key, generated by cert-manager on first registration; not a pre-provisioned Secret.
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - selector:
          # lab.ardw.be and every name under it (the *.lab.ardw.be wildcard), plus files.ardw.be, the
          # Seafile name that is both internal and public (docs/decisions.md §5.13).
          dnsZones:
            - lab.ardw.be
            - files.ardw.be
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Same ACME contact as letsencrypt-staging.
    email: dev@arthurdw.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - selector:
          dnsZones:
            - lab.ardw.be
            - files.ardw.be
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
