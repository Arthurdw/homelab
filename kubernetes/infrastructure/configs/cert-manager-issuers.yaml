---
# Internal CA ClusterIssuer chain — placeholder for the internal domain.
# TODO(GATE 0): either configure a DNS-01 issuer backed by Technitium for a real CA,
# or keep an internal CA and distribute its root to clients. Technique TBD.
#
# Lives under infrastructure/configs: the cert-manager.io CRDs are installed BY the
# cert-manager HelmRelease, so these CRs are only applied after the controllers are healthy.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca-keypair
