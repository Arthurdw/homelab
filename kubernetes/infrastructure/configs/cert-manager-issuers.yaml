---
# Internal CA ClusterIssuer chain. Per docs/decisions.md §5.7 this is the FALLBACK only: apps get a
# Let's Encrypt wildcard for *.lab.ardw.be via DNS-01 against Cloudflare.
# TODO: add the letsencrypt ClusterIssuer once the zone-scoped Cloudflare token exists (SOPS secret),
# then move the app ingresses off internal-ca.
#
# Lives under infrastructure/configs: the cert-manager.io CRDs are installed BY the
# cert-manager HelmRelease, so these CRs are only applied after the controllers are healthy.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca-keypair
