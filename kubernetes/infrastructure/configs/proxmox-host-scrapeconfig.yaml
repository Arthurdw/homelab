---
# Scrapes node-exporter on the Proxmox host (infrastructure/environments/homelab/proxmox/host-metrics.tf):
# the host's own temperatures and fan speeds (hwmon), and the GPU fan controller's duty, GPU reading, fan rpm
# and state from its textfile (scripts/fan-control/gpu-fan-control.sh). Behind the "GPU & cooling" dashboard
# (infrastructure/monitoring/dashboards/gpu-cooling.json) and the homelab.gpu fan alerts.
#
# The host is outside the cluster, so a static target from cluster-settings (PROXMOX_HOST_METRICS). In the
# lab that is the L1 PVE fixture (docs/lab.md), which only answers while it runs and has host_metrics applied.
#
# The `release` label is what Prometheus selects ScrapeConfigs by. Lives under infrastructure/configs: the
# ScrapeConfig CRD comes from the kube-prometheus-stack HelmRelease, reconciled before this Kustomization.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: proxmox-host
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: proxmox-host
  scrapeInterval: 15s
  staticConfigs:
    - targets:
        - ${PROXMOX_HOST_METRICS}
  # poseidon's NCT6793 reports temperature inputs with nothing attached (SYSTIN, AUXTIN1-3: a flat
  # 108-117 °C), PCH and TSI slots the board does not use (0 °C, 3892314 °C) and a PECI calibration value
  # (temp1, temp4-6, temp8-20; docs/hardware.md). Drop them so they never reach a query or an alert. Kept:
  # temp2 CPUTIN, temp3 AUXTIN0, temp7 PECI Agent 0. The lab fixture has no such chip.
  metricRelabelings:
    - action: drop
      sourceLabels: [__name__, chip, sensor]
      separator: ";"
      regex: node_hwmon_(temp_.+|sensor_label);platform_nct6775_\d+;temp([14-689]|1\d|20)
