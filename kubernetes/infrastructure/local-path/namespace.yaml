---
# Privileged Pod Security is required by the Talos local-storage guide: the provisioner's helper
# pods mount hostPath volumes, which the default `baseline` policy rejects.
# https://docs.siderolabs.com/kubernetes-guides/csi/local-storage.md
apiVersion: v1
kind: Namespace
metadata:
  name: local-path
  labels:
    pod-security.kubernetes.io/enforce: privileged
