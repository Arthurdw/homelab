---
# Node-local dynamic storage for latency-sensitive databases (docs/decisions.md §4.3).
# Rancher local-path-provisioner from its upstream OCI chart (source.yaml); renders the
# StorageClass `local-path` that postgres and the app PVCs reference.
#
# Data path: the chart default (/opt/local-path-provisioner) is on Talos' read-only rootfs, so
# nodePathMap points at /var/mnt/local-path-provisioner, the mount point of the Talos
# UserVolumeConfig `local-path-provisioner` (talos/patches/worker.yaml, worker-only, on the
# worker's dedicated data disk). A user volume is its own partition, so wiping EPHEMERAL does not
# touch it. Keep the volume name and nodePathMap in sync. Talos guide:
# https://docs.siderolabs.com/kubernetes-guides/csi/local-storage.md
#
# The lab worker has no such volume; there the path simply lives on the writable EPHEMERAL
# partition (/var), which is fine for a throwaway cluster.
#
# Not HA: one worker, no replication. If the node or its data disk is lost, recovery is the
# scheduled logical dumps on the NAS (kubernetes/apps/immich/backup.yaml).
#
# StorageClass: reclaimPolicy Retain (never delete the only copy of a database);
# WaitForFirstConsumer (provision on the node that runs the pod); not the cluster default.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: local-path-provisioner
    namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    storageClass:
      create: true
      # Referenced by name from the app manifests.
      name: local-path
      # Upstream's canonical provisioner ID (the chart would otherwise derive one from the release name).
      provisionerName: rancher.io/local-path
      # No default class: a PVC without a class stays Pending instead of landing on the wrong storage.
      defaultClass: false
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
    # Must match the Talos UserVolumeConfig mount point (see header).
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/local-path-provisioner

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
