---
# Upstream OCI Helm chart for local-path-provisioner, pinned by tag. Kept next to its HelmRelease
# (in flux-system, where the release's chartRef expects it).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
  ref:
    tag: 0.0.37
