---
# MetalLB L2 address pool. PLACEHOLDER range (RFC 5737 TEST-NET-1) — replace with a range
# reserved at GATE 0 (see docs/network-plan.md). Never take addresses from the DHCP pool.
#
# NOTE: IPAddressPool/L2Advertisement CRDs are installed by the MetalLB release; Flux will
# retry until they exist.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb
spec:
  addresses:
    - 192.0.2.240-192.0.2.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb
spec:
  ipAddressPools:
    - default
