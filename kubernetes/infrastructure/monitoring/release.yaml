---
# Monitoring baseline: kube-prometheus-stack (Prometheus, Alertmanager, Grafana, node-exporter,
# kube-state-metrics). One replica of everything, no remote-write or long-term storage
# (docs/architecture.md §3; risk R11).
#
# The starter alerts are Helm values (additionalPrometheusRulesMap), not PrometheusRule CRs: this
# release installs the monitoring.coreos.com CRDs, and Flux dry-runs a whole Kustomization before
# applying it (see kubernetes/README.md).
#
# Secrets (grafana-admin, grafana-oidc, alertmanager-smtp) are created out-of-band (SOPS overlays) and never
# committed in cleartext.
# Prometheus, Alertmanager and Grafana keep their state on `local-path` PVCs (docs/decisions.md
# §4.3: state stays node-local), so a pod restart loses neither samples, silences nor dashboards.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.10.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Single host: extra replicas buy no availability.
    prometheus:
      # Internal zone <app>.lab.ardw.be (decisions.md §5.7), TLS from Traefik's default TLSStore (the
      # *.lab.ardw.be wildcard, as for Grafana below). Prometheus has no login of its own, so the host is behind
      # Authentik forward-auth, admins only (kubernetes/apps/authentik/forward-auth.yaml, blueprints.yaml).
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd
        hosts:
          - prometheus.lab.ardw.be
        paths:
          - /
        pathType: Prefix
        tls:
          - hosts:
              - prometheus.lab.ardw.be
      prometheusSpec:
        replicas: 1
        # The base of the "Source" links in alert emails; without it they point at the in-cluster Service.
        externalUrl: https://prometheus.lab.ardw.be
        # Whichever limit is hit first wins. retentionSize stays below the 20Gi claim (about 90%)
        # so the WAL and compaction have headroom. local-path does not enforce the claim size,
        # so this is the actual cap on the worker's data disk (§3.4).
        retention: 15d
        retentionSize: 18GB
        # local-path hands out a root-owned hostPath, which ignores the pod's fsGroup, so the
        # non-root Prometheus (uid 1000) can't write /prometheus. Hand it over before it starts.
        initContainers:
          - name: init-data-permissions
            image: docker.io/library/busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command: ["chown", "-R", "1000:2000", "/prometheus"]
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN"]
            volumeMounts:
              - name: prometheus-kube-prometheus-stack-prometheus-db
                mountPath: /prometheus
                subPath: prometheus-db
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
    alertmanager:
      # Internal zone <app>.lab.ardw.be (decisions.md §5.7), TLS from Traefik's default TLSStore (the
      # *.lab.ardw.be wildcard, as for Grafana below). Alertmanager has no login of its own, so the host is behind
      # Authentik forward-auth, admins only (kubernetes/apps/authentik/forward-auth.yaml, blueprints.yaml).
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd
        hosts:
          - alertmanager.lab.ardw.be
        paths:
          - /
        pathType: Prefix
        tls:
          - hosts:
              - alertmanager.lab.ardw.be
      alertmanagerSpec:
        replicas: 1
        # The base of the "View in Alertmanager" links in alert emails; without it they point at the
        # in-cluster Service.
        externalUrl: https://alertmanager.lab.ardw.be
        # Silences and the notification log; tiny.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        # Mounted at /etc/alertmanager/secrets/<name>/ and read via `auth_password_file` below.
        # Required Secret `alertmanager-smtp` (namespace monitoring, key `smtp-password`),
        # SOPS-encrypted; without it the Alertmanager pod does not start (docs/runbooks/secrets.md).
        secrets:
          - alertmanager-smtp

      # Alerting (docs/decisions.md §5.1): email now, Telegram later. One relay login, one From
      # address per app.
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: 'mail.a-line.be:465'
          smtp_from: 'alertmanager@lab.ardw.be'
          smtp_auth_username: 'homelab@lab.ardw.be'
          # Port 465 is implicit TLS: Alertmanager dials TLS itself, and require_tls would demand
          # STARTTLS on top, which the relay doesn't offer there.
          smtp_require_tls: false
        # The chart's severity + InfoInhibitor rules, plus one homelab rule (last): a NotReady
        # node suppresses its own warning/info alerts. Critical alerts are not suppressed.
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
          - target_matchers:
              - 'alertname = InfoInhibitor'
          - source_matchers:
              - 'alertname = HomelabNodeNotReady'
            target_matchers:
              - 'severity =~ warning|info'
            equal:
              - 'node'
        route:
          receiver: email
          group_by: ['namespace', 'alertname']
          group_wait: 30s        # batch the first burst of a new alert group
          group_interval: 5m     # how soon a changed group is re-sent
          repeat_interval: 12h   # steady-state re-notify for warnings
          routes:
            # Watchdog (always firing) and InfoInhibitor must never be emailed.
            - receiver: 'null'
              matchers:
                - alertname = "Watchdog"
            - receiver: 'null'
              matchers:
                - alertname = "InfoInhibitor"
            # Critical re-notifies sooner.
            - receiver: email
              matchers:
                - severity = "critical"
              repeat_interval: 4h
        receivers:
          - name: 'null'
          - name: email
            email_configs:
              - to: 'dev@arthurdw.com'    # TODO(owner): confirm the recipient(s)
                send_resolved: true
                # Password comes from the mounted alertmanager-smtp Secret, never git.
                auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp-password
          # Telegram (disabled): with a bot token, uncomment, add a `receiver: telegram` route and
          # add an `alertmanager-telegram` Secret to alertmanagerSpec.secrets.
          #
          # - name: telegram
          #   telegram_configs:
          #     - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
          #       chat_id: TODO_TELEGRAM_CHAT_ID
          #       send_resolved: true
        templates:
          - '/etc/alertmanager/config/*.tmpl'

    grafana:
      # Required Secret `grafana-admin` (namespace monitoring, keys `admin-user`, `admin-password`),
      # SOPS-encrypted; Grafana is not Ready without it (docs/runbooks/secrets.md).
      admin:
        existingSecret: grafana-admin
      # SQLite database (users, preferences, dashboards edited in the UI) on a local-path PVC.
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        size: 2Gi
      # A rolling update would run two pods against one RWO volume and one SQLite file; Recreate
      # stops the old pod first.
      deploymentStrategy:
        type: Recreate

      ingress:
        enabled: true
        ingressClassName: traefik
        # Internal zone <app>.lab.ardw.be (decisions.md §5.7), served by Technitium only.
        hosts:
          - grafana.lab.ardw.be
        path: /
        pathType: Prefix
        # TLS on websecure with NO secretName and no cert-manager annotation: Traefik serves its default
        # TLSStore certificate, the *.lab.ardw.be wildcard (infrastructure/configs/
        # wildcard-certificate.yaml, decisions.md §5.7). One cert for every app.
        tls:
          - hosts:
              - grafana.lab.ardw.be

      # Secrets as env vars, never in grafana.ini: the OIDC client secret (`grafana-oidc`, same value as
      # authentik/authentik-grafana-oidc, scripts/secrets/gen-*-secrets.sh) and the shared relay password
      # (`alertmanager-smtp`, docs/decisions.md §5.1).
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client-secret
        GF_SMTP_PASSWORD:
          secretKeyRef:
            name: alertmanager-smtp
            key: smtp-password

      grafana.ini:
        server:
          root_url: https://grafana.lab.ardw.be/
        # Sign-in through Authentik (kubernetes/apps/authentik/blueprints.yaml, grafana.yaml; docs/runbooks/sso.md).
        # The local admin from `grafana-admin` keeps working: the login form stays enabled as the fallback
        # when Authentik is down (docs/runbooks/break-glass.md).
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: grafana
          scopes: openid email profile
          auth_url: https://auth.lab.ardw.be/application/o/authorize/
          token_url: https://auth.lab.ardw.be/application/o/token/
          api_url: https://auth.lab.ardw.be/application/o/userinfo/
          signout_redirect_url: https://auth.lab.ardw.be/application/o/grafana/end-session/
          login_attribute_path: preferred_username
          name_attribute_path: name
          email_attribute_path: email
          # `groups` comes from Authentik's profile scope: members of `authentik Admins` are org Admins, everyone
          # else a Viewer. Server-admin stays with the local admin (returning 'GrafanaAdmin' here together with
          # allow_assign_grafana_admin: true would grant it too).
          role_attribute_path: "contains(groups, 'authentik Admins') && 'Admin' || 'Viewer'"
          use_pkce: true
          allow_sign_up: true
          auto_login: false
        # Mail (invites, password resets, alert notifications) via the shared relay (docs/decisions.md §5.1).
        # Port 465 is implicit TLS: Grafana dials TLS itself on 465, so no STARTTLS on top.
        smtp:
          enabled: true
          host: mail.a-line.be:465
          user: homelab@lab.ardw.be
          from_address: grafana@lab.ardw.be
          from_name: Grafana
          startTLS_policy: NoStartTLS

    # Flux object state as metrics: gotk_resource_info, one series per Kustomization, HelmRelease,
    # source and notification object, with its ready/suspended state and revision. It feeds the
    # "Flux Cluster Stats" dashboard (monitoring/kustomization.yaml) and the homelab.flux alerts below.
    # From fluxcd/flux2-monitoring-example's kube-state-metrics-config.yaml at
    # 6182ebdc4ac55c87a72ccbfe4b7e612c62a516ab, with two changes:
    # - Its `collectors: []` and `--custom-resource-state-only` are left out. They suit a
    #   kube-state-metrics dedicated to Flux; this one also serves the chart's default rules and the
    #   homelab.node/homelab.backup alerts.
    # - The image.toolkit.fluxcd.io kinds are left out: this cluster runs no image automation.
    # The API versions must match the installed Flux CRDs; check them when upgrading Flux.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - buckets
              - helmrepositories
              - helmcharts
              - ocirepositories
              - kustomizations
              - helmreleases
              - alerts
              - providers
              - receivers
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_app_version: [status, history, "0", appVersion]
                      chart_ref_name: [spec, chartRef, name]
                      chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Bucket resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      endpoint: [spec, endpoint]
                      bucket_name: [spec, bucketName]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      chart_name: [spec, chart]
                      chart_version: [spec, version]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Alert
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Alert resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Provider
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Provider resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1
                  kind: Receiver
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Receiver resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      webhook_path: [status, webhookPath]

    # Not scrapable on Talos (etcd needs mTLS, controller-manager/scheduler bind to localhost,
    # kube-proxy is disabled): disable the targets and their alert groups, which would otherwise
    # fire forever.
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeControllerManager: false
        kubeProxy: false
      # Overcommit alerts assume a cluster that must survive losing a node. Two nodes on one host with no HA
      # (docs/decisions.md §3.1, §5.11) can't, so they would fire permanently. Quota overcommit stays on.
      disabled:
        KubeCPUOvercommit: true
        KubeMemoryOvercommit: true

    # Starter alerts on top of the chart's default rules (spec §7.8).
    additionalPrometheusRulesMap:
      homelab-starters:
        groups:
          - name: homelab.node
            rules:
              - alert: NodeRootDiskSpacePressure
                # The chart's filesystem alerts fire at <5% free; warn earlier (single SSD, risk R1).
                expr: |
                  (
                    node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs"}
                    /
                    node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs"}
                    * 100
                  ) < 15
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Node filesystem is above 85% used."
                  description: "{{ $labels.instance }} mount {{ $labels.mountpoint }} has less than 15% free."
              - alert: HomelabNodeNotReady
                # KubeNodeNotReady is silent for cordoned nodes; this fires for any NotReady node.
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "Node {{ $labels.node }} is NotReady."
                  description: "{{ $labels.node }} has reported NotReady for more than 10 minutes."
          # Backup freshness (§5.1), from kube-state-metrics' CronJob metrics rather than a
          # custom exporter. Covers every database dump CronJob by naming convention: one CronJob
          # per namespace named `<app>-db-dump`, daily (immich/immich-db-dump at 03:17 UTC,
          # authentik/authentik-db-dump at 03:47 UTC). 36h allows one missed or late run.
          # The failure rule joins on namespace alone, so keep it to one dump CronJob per namespace.
          - name: homelab.backup
            rules:
              - alert: DatabaseBackupStale
                expr: |
                  time() - kube_cronjob_status_last_successful_time{cronjob=~".+-db-dump"}
                    > 60 * 60 * 36
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "Database dump {{ $labels.namespace }}/{{ $labels.cronjob }} is stale."
                  description: "The last successful run of {{ $labels.namespace }}/{{ $labels.cronjob }} finished {{ $value | humanizeDuration }} ago (threshold 36h)."
              - alert: DatabaseBackupNeverSucceeded
                # The metric only exists after a first success, so the rule above stays silent if
                # the dump has never worked. This fires when the CronJob exists but has no
                # success recorded; the 36h `for` lets the first scheduled run happen after install.
                expr: |
                  kube_cronjob_info{cronjob=~".+-db-dump"}
                    unless on (namespace, cronjob)
                  kube_cronjob_status_last_successful_time{cronjob=~".+-db-dump"}
                for: 36h
                labels:
                  severity: critical
                annotations:
                  summary: "Database dump {{ $labels.namespace }}/{{ $labels.cronjob }} has never succeeded."
                  description: "{{ $labels.namespace }}/{{ $labels.cronjob }} exists but has no successful run recorded."
              - alert: DatabaseBackupJobFailed
                # Also the size-anomaly alert: a dump under DUMP_MIN_PERCENT of the previous one fails
                # its Job (see the dump CronJobs), so it lands here with "SIZE ANOMALY" in the logs.
                # Faster than staleness: a failed dump alerts the same morning, at critical (the
                # chart's KubeJobFailed is a warning for every namespace). A failed Job stays in
                # the CronJob history for days (failedJobsHistoryLimit), so failures that started
                # before the last successful run are dropped: a later success clears the alert.
                # With no success ever recorded, the `unless` side is empty and every failure fires.
                expr: |
                  max by (namespace, job_name) (
                    kube_job_failed{job_name=~".+-db-dump-.+", condition="true"}
                  ) > 0
                  unless on (namespace, job_name)
                  (
                    kube_job_status_start_time{job_name=~".+-db-dump-.+"}
                      < on (namespace) group_left ()
                    kube_cronjob_status_last_successful_time{cronjob=~".+-db-dump"}
                  )
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Database dump Job {{ $labels.namespace }}/{{ $labels.job_name }} failed."
                  description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed (a dump error or a size anomaly); see `kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}`."
          # Flux reconciliation (from gotk_resource_info, see kube-state-metrics above). A failed
          # reconcile leaves the cluster on the last good revision, so this is a warning: nothing
          # breaks, but new commits stop landing. Suspended objects are paused on purpose and skipped.
          # 15 minutes rides out a dependency that is still becoming ready during a rollout.
          - name: homelab.flux
            rules:
              - alert: FluxReconciliationFailure
                expr: |
                  max by (exported_namespace, name, customresource_kind) (
                    gotk_resource_info{ready="False", suspended!="true"}
                  ) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready."
                  description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been failing to reconcile for 15 minutes; see `flux get all -A --status-selector ready=false` and `flux events -A`."
          # Tesla P4 temperature, from the GPU exporter (infrastructure/nvidia-device-plugin/gpu-exporter.yaml),
          # and its fan, from the controller's textfile on the Proxmox host's node-exporter
          # (infrastructure/configs/proxmox-host-scrapeconfig.yaml). The card is passive: the fan controller
          # (docs/runbooks/gpu-fan-control.md) follows this same reading and is at 100% from 70°C, because the
          # duct between fan and card is PETG, which softens from ~70°C (docs/decisions.md §3.8). So 75 means
          # full speed is not keeping up and the duct is at risk; 88 means the cooling has failed (the P4
          # throttles in the low 90s). The lab has no GPU and no controller, so these never fire there; there
          # is no absent() rule on purpose.
          - name: homelab.gpu
            rules:
              - alert: GpuTemperatureHigh
                expr: nvidia_smi_temperature_gpu > 75
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "GPU {{ $labels.uuid }} is at {{ $value }}°C."
                  description: "The Tesla P4 has been above 75°C for 5 minutes although the fan is at 100% from 70°C: the cooling is not keeping up and the PETG duct is near its softening point. Check the fan and the duct, and `journalctl -u gpu-fan-control` on poseidon."
              - alert: GpuTemperatureCritical
                expr: nvidia_smi_temperature_gpu > 88
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "GPU {{ $labels.uuid }} is at {{ $value }}°C."
                  description: "The Tesla P4 is close to throttling. The fan controller is not keeping up or not running; see docs/runbooks/gpu-fan-control.md."
              - alert: GpuExporterDown
                # Without the exporter the fan controller has no reading and holds the fan at 100%.
                expr: up{job="nvidia-gpu-exporter"} == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "The GPU exporter on {{ $labels.instance }} is down."
                  description: "No GPU temperature for 5 minutes; the fan controller has fallen back to 100%. See `kubectl -n nvidia-device-plugin logs ds/nvidia-gpu-exporter`."
              - alert: GpuFanStalled
                # The controller sends a stopped fan to 100% at once, so a minute below 300 rpm is a dead
                # fan, a loose cable or a jammed blade: the card has no cooling at all.
                expr: gpu_fan_control_fan_rpm < 300 and gpu_fan_control_duty_percent > 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "The GPU fan is at {{ $value }} rpm."
                  description: "The Tesla P4's fan is not turning although the controller drives it. Check the fan and its cable on poseidon's GPU header (docs/runbooks/gpu-fan-control.md); shut the GPU workload down if it does not come back."
              - alert: GpuFanCurveFloorTooLow
                # The fan stopped once at a low duty; the controller now keeps it 10 points above that duty
                # until a restart. Raise the curve's lowest duty so it does not happen again.
                expr: gpu_fan_control_stalls_total > 0
                labels:
                  severity: warning
                annotations:
                  summary: "The GPU fan stalled {{ $value }} time(s) at a low duty."
                  description: "The fan stopped below 100%, so the curve's floor is under the fan's minimum. Raise the lowest duty in gpu_fan_control.curve (docs/runbooks/gpu-fan-control.md, Troubleshooting) and apply."
              - alert: GpuFanControlNotOk
                # stale: no GPU reading (the fan is at 100%); failsafe: the service stopped (fan at 100%).
                expr: gpu_fan_control_state{state=~"stale|failsafe"} == 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "The GPU fan controller is {{ $labels.state }}."
                  description: "The fan has been at 100% for 5 minutes because the controller has no GPU reading or is stopped. See `systemctl status gpu-fan-control` and `journalctl -u gpu-fan-control` on poseidon."
              - alert: GpuFanControlStale
                # The controller rewrites its textfile every interval; an old one means it hangs or was
                # killed without its stop handler, so the fan may be left at any duty.
                expr: time() - gpu_fan_control_updated_timestamp_seconds > 120
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "The GPU fan controller has not reported for {{ $value | humanizeDuration }}."
                  description: "The controller's textfile on poseidon is not being updated, so the fan is at whatever duty it was last set to. See `systemctl status gpu-fan-control` on poseidon."
              - alert: ProxmoxHostMetricsDown
                # Without these metrics the fan alerts above cannot fire.
                expr: up{job="proxmox-host"} == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "node-exporter on the Proxmox host ({{ $labels.instance }}) is down."
                  description: "No host temperatures, fan speeds or fan controller metrics for 10 minutes, so the GPU fan alerts are blind. Check `systemctl status prometheus-node-exporter` on the host and the gateway rule from the K8s VLAN to port 9100. In the lab this fires whenever the PVE fixture is not running."
