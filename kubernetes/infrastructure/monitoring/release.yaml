---
# Monitoring baseline: kube-prometheus-stack (Prometheus, Alertmanager, Grafana, node-exporter,
# kube-state-metrics). One replica of everything, no remote-write or long-term storage
# (docs/architecture.md §3; risk R11).
#
# The starter alerts are Helm values (additionalPrometheusRulesMap), not PrometheusRule CRs: this
# release installs the monitoring.coreos.com CRDs, and Flux dry-runs a whole Kustomization before
# applying it (see kubernetes/README.md).
#
# Secrets (grafana-admin, alertmanager-smtp) are created out-of-band and never committed.
# Prometheus, Alertmanager and Grafana keep their state on `local-path` PVCs (docs/decisions.md
# §4.3: state stays node-local), so a pod restart loses neither samples, silences nor dashboards.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.10.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Single host: extra replicas buy no availability.
    prometheus:
      prometheusSpec:
        replicas: 1
        # Whichever limit is hit first wins. retentionSize stays below the 20Gi claim (about 90%)
        # so the WAL and compaction have headroom. local-path does not enforce the claim size,
        # so this is the actual cap on the worker's data disk (§3.4).
        retention: 15d
        retentionSize: 18GB
        # local-path hands out a root-owned hostPath, which ignores the pod's fsGroup, so the
        # non-root Prometheus (uid 1000) can't write /prometheus. Hand it over before it starts.
        initContainers:
          - name: init-data-permissions
            image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
            command: ["chown", "-R", "1000:2000", "/prometheus"]
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN"]
            volumeMounts:
              - name: prometheus-kube-prometheus-stack-prometheus-db
                mountPath: /prometheus
                subPath: prometheus-db
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
    alertmanager:
      alertmanagerSpec:
        replicas: 1
        # Silences and the notification log; tiny.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        # Mounted at /etc/alertmanager/secrets/<name>/ and read via `auth_password_file` below.
        # Required Secret `alertmanager-smtp` (namespace monitoring, key `smtp-password`),
        # SOPS-encrypted; without it the Alertmanager pod does not start (docs/runbooks/secrets.md).
        secrets:
          - alertmanager-smtp

      # Alerting (docs/decisions.md §5.1): email now, Telegram later. One relay login, one From
      # address per app.
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: 'mail.a-line.be:465'
          smtp_from: 'alertmanager@lab.ardw.be'
          smtp_auth_username: 'homelab@lab.ardw.be'
          # Port 465 is implicit TLS: Alertmanager dials TLS itself, and require_tls would demand
          # STARTTLS on top, which the relay doesn't offer there.
          smtp_require_tls: false
        # The chart's severity + InfoInhibitor rules, plus one homelab rule (last): a NotReady
        # node suppresses its own warning/info alerts. Critical alerts are not suppressed.
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
          - target_matchers:
              - 'alertname = InfoInhibitor'
          - source_matchers:
              - 'alertname = HomelabNodeNotReady'
            target_matchers:
              - 'severity =~ warning|info'
            equal:
              - 'node'
        route:
          receiver: email
          group_by: ['namespace', 'alertname']
          group_wait: 30s        # batch the first burst of a new alert group
          group_interval: 5m     # how soon a changed group is re-sent
          repeat_interval: 12h   # steady-state re-notify for warnings
          routes:
            # Watchdog (always firing) and InfoInhibitor must never be emailed.
            - receiver: 'null'
              matchers:
                - alertname = "Watchdog"
            - receiver: 'null'
              matchers:
                - alertname = "InfoInhibitor"
            # Critical re-notifies sooner.
            - receiver: email
              matchers:
                - severity = "critical"
              repeat_interval: 4h
        receivers:
          - name: 'null'
          - name: email
            email_configs:
              - to: 'dev@arthurdw.com'    # TODO(owner): confirm the recipient(s)
                send_resolved: true
                # Password comes from the mounted alertmanager-smtp Secret, never git.
                auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp-password
          # Telegram (disabled): with a bot token, uncomment, add a `receiver: telegram` route and
          # add an `alertmanager-telegram` Secret to alertmanagerSpec.secrets.
          #
          # - name: telegram
          #   telegram_configs:
          #     - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
          #       chat_id: TODO_TELEGRAM_CHAT_ID
          #       send_resolved: true
        templates:
          - '/etc/alertmanager/config/*.tmpl'

    grafana:
      # Required Secret `grafana-admin` (namespace monitoring, keys `admin-user`, `admin-password`),
      # SOPS-encrypted; Grafana is not Ready without it (docs/runbooks/secrets.md).
      admin:
        existingSecret: grafana-admin
      # SQLite database (users, preferences, dashboards edited in the UI) on a local-path PVC.
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        size: 2Gi
      # A rolling update would run two pods against one RWO volume and one SQLite file; Recreate
      # stops the old pod first.
      deploymentStrategy:
        type: Recreate

    # Not scrapable on Talos (etcd needs mTLS, controller-manager/scheduler bind to localhost,
    # kube-proxy is disabled): disable the targets and their alert groups, which would otherwise
    # fire forever.
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeControllerManager: false
        kubeProxy: false

    # Starter alerts on top of the chart's default rules (spec §7.8).
    additionalPrometheusRulesMap:
      homelab-starters:
        groups:
          - name: homelab.node
            rules:
              - alert: NodeRootDiskSpacePressure
                # The chart's filesystem alerts fire at <5% free; warn earlier (single SSD, risk R1).
                expr: |
                  (
                    node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs"}
                    /
                    node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs"}
                    * 100
                  ) < 15
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Node filesystem is above 85% used."
                  description: "{{ $labels.instance }} mount {{ $labels.mountpoint }} has less than 15% free."
              - alert: HomelabNodeNotReady
                # KubeNodeNotReady is silent for cordoned nodes; this fires for any NotReady node.
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "Node {{ $labels.node }} is NotReady."
                  description: "{{ $labels.node }} has reported NotReady for more than 10 minutes."
          # Backup freshness (§5.1), from kube-state-metrics' CronJob metrics rather than a
          # custom exporter. Covers every database dump CronJob by naming convention: one CronJob
          # per namespace named `<app>-db-dump`, daily (immich/immich-db-dump at 03:17 UTC,
          # authentik/authentik-db-dump at 03:47 UTC). 36h allows one missed or late run.
          # The failure rule joins on namespace alone, so keep it to one dump CronJob per namespace.
          - name: homelab.backup
            rules:
              - alert: DatabaseBackupStale
                expr: |
                  time() - kube_cronjob_status_last_successful_time{cronjob=~".+-db-dump"}
                    > 60 * 60 * 36
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "Database dump {{ $labels.namespace }}/{{ $labels.cronjob }} is stale."
                  description: "The last successful run of {{ $labels.namespace }}/{{ $labels.cronjob }} finished {{ $value | humanizeDuration }} ago (threshold 36h)."
              - alert: DatabaseBackupNeverSucceeded
                # The metric only exists after a first success, so the rule above stays silent if
                # the dump has never worked. This fires when the CronJob exists but has no
                # success recorded; the 36h `for` lets the first scheduled run happen after install.
                expr: |
                  kube_cronjob_info{cronjob=~".+-db-dump"}
                    unless on (namespace, cronjob)
                  kube_cronjob_status_last_successful_time{cronjob=~".+-db-dump"}
                for: 36h
                labels:
                  severity: critical
                annotations:
                  summary: "Database dump {{ $labels.namespace }}/{{ $labels.cronjob }} has never succeeded."
                  description: "{{ $labels.namespace }}/{{ $labels.cronjob }} exists but has no successful run recorded."
              - alert: DatabaseBackupJobFailed
                # Also the size-anomaly alert: a dump under DUMP_MIN_PERCENT of the previous one fails
                # its Job (see the dump CronJobs), so it lands here with "SIZE ANOMALY" in the logs.
                # Faster than staleness: a failed dump alerts the same morning, at critical (the
                # chart's KubeJobFailed is a warning for every namespace). A failed Job stays in
                # the CronJob history for days (failedJobsHistoryLimit), so failures that started
                # before the last successful run are dropped: a later success clears the alert.
                # With no success ever recorded, the `unless` side is empty and every failure fires.
                expr: |
                  max by (namespace, job_name) (
                    kube_job_failed{job_name=~".+-db-dump-.+", condition="true"}
                  ) > 0
                  unless on (namespace, job_name)
                  (
                    kube_job_status_start_time{job_name=~".+-db-dump-.+"}
                      < on (namespace) group_left ()
                    kube_cronjob_status_last_successful_time{cronjob=~".+-db-dump"}
                  )
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Database dump Job {{ $labels.namespace }}/{{ $labels.job_name }} failed."
                  description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed (a dump error or a size anomaly); see `kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}`."
