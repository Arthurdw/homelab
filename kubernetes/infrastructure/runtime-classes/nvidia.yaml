---
# NVIDIA container runtime for GPU pods. The `nvidia` handler is registered in containerd by the Talos
# `siderolabs/nvidia-container-toolkit-production` extension (talos/schematic.yaml), and only works on a node
# that also loads the driver (talos/patches/gpu-worker.yaml: the production worker with the Tesla P4).
# Name and handler follow the extension's README:
# https://github.com/siderolabs/extensions/blob/v1.14.4/nvidia-gpu/nvidia-container-toolkit/README.md
#
# Use for GPU workloads: `spec.runtimeClassName: nvidia` plus a `nvidia.com/gpu: 1` limit, which the device
# plugin (../nvidia-device-plugin) advertises. The lab has no GPU: the class exists there but no node can run it.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
