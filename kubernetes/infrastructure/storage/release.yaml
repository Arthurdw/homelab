---
# Dynamic NFS storage for application PVCs (docs/decisions.md §4.1, §4.2): StorageClass `nas-nfs`.
#
# csi-driver-nfs, not democratic-csi: it is stateless and provisions each PV as a sub-directory
# of an existing TrueNAS export (the NAS stays the single owner of the data), with no API key
# Secret. Switch to democratic-csi only if per-PVC ZFS snapshots or hard quotas are needed.
#
# Not the cluster default, so a database PVC can never silently land on the network
# (decisions.md §4.3). Databases use the `local-path` class (infrastructure/local-path).
#
# Snapshots: point-in-time protection is the NAS's recursive snapshot policy on `main/k8s`
# (decisions.md §4.1), so the snapshotter sidecar and VolumeSnapshot CRDs are not installed.
#
# NAS prerequisite (decisions.md §1.2): the `main/k8s` dataset and NFS export must exist with
# no_root_squash (the driver mkdirs and chowns as root), reachable on the storage link.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: storage
spec:
  interval: 1h
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.5
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # ${NFS_SERVER} comes from the per-cluster cluster-settings ConfigMap (Flux postBuild).
    storageClass:
      create: true
      name: nas-nfs
      parameters:
        # An IP, so mounting does not depend on cluster DNS (docs/architecture.md §6).
        server: ${NFS_SERVER}
        share: /mnt/main/k8s
        # One directory per PVC (<namespace>/<name>) so PVCs in a namespace never share storage.
        # With Retain, re-creating a PVC of the same name re-mounts its old directory.
        # `$${...}` is Flux's escape: the driver receives the literal `${pvc.metadata.*}` tokens,
        # whereas an unescaped one fails Flux's substitution for the whole Kustomization.
        subDir: "$${pvc.metadata.namespace}/$${pvc.metadata.name}"
      # Retain: deleting a PVC never deletes data; directories are cleaned up by hand.
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      # Pinned so the client cannot silently fall back to NFSv3; must match the export.
      mountOptions:
        - nfsvers=4.1

    # Single replica; no snapshotter sidecar (snapshots are the NAS's job).
    controller:
      replicas: 1
      enableSnapshotter: false
