---
# Internal DNS resolver (Technitium, docs/decisions.md §5.7 and §6.1); serves the split-horizon
# A records for *.lab.ardw.be (§5.7). See docs/network-plan.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: technitium
  namespace: technitium
spec:
  interval: 1h
  chart:
    spec:
      chart: technitium-dnsserver
      version: 1.13.4
      sourceRef:
        kind: HelmRepository
        name: technitium
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # The chart (bjw-s "common" library) treats every key under `service` as a service NAME.
    # So this must be nested as service.main.type — a top-level `service.type` becomes a bogus
    # service named "type" whose value is a string, which breaks template rendering.
    # (Found by the lab: "can't evaluate field enabled in type interface {}".)
    service:
      main:
        type: LoadBalancer
    # TODO: persistence (PVC/storage class), upstream forwarders, a stable LoadBalancer IP
    # from the MetalLB pool so clients can use it as their resolver, and trim the exposed ports
    # (the chart defaults to web 80/443, DNS 53 tcp+udp, DHCP 67, DoT 853, DoH 8053).
