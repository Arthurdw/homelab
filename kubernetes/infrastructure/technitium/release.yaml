---
# Internal DNS resolver — see docs/network-plan.md. What ultimately serves the internal
# resolver is a GATE 0 decision; this is the proposed in-cluster option.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: technitium
  namespace: technitium
spec:
  interval: 1h
  chart:
    spec:
      chart: technitium-dnsserver
      version: 1.13.4
      sourceRef:
        kind: HelmRepository
        name: technitium
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # TODO(GATE 0): persistence (PVC/storage class), forwarders, and a stable LoadBalancer IP
    # from the MetalLB pool so clients can use it as their resolver.
    service:
      type: LoadBalancer
