---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.0.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # LoadBalancer Service, address from the MetalLB pool (configs/metallb-pool.yaml).
    service:
      type: LoadBalancer
    # TODO: HTTP→HTTPS redirect, the default wildcard certificate (decisions §5.7), dashboard exposure.
    ingressClass:
      enabled: true
      isDefaultClass: true
