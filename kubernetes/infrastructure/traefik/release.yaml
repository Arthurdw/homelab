---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.0.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # A LoadBalancer Service served by MetalLB (see metalb/pool.yaml).
    service:
      type: LoadBalancer
    # CRDs are managed above; chart defaults otherwise.
    # TODO(GATE 0): TLS/redirect + internal-vs-external entrypoints, dashboard exposure.
    ingressClass:
      enabled: true
      isDefaultClass: true
