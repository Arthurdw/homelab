---
# apps overlay for `homelab`: the shared tree plus this cluster's SOPS secrets (kubernetes/overlays/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps
  # Homelab only: proxies to poseidon and hercules-nas, which the lab does not have (docs/runbooks/host-proxies.md).
  - ../../../apps/host-proxies
  - immich-db.sops.yaml
  - authentik-credentials.sops.yaml
  - authentik-smtp.sops.yaml
  - seafile-db.sops.yaml
  - seafile-admin.sops.yaml
  - seafile-smtp.sops.yaml
  - seafile-jwt.sops.yaml
  - authentik-seafile-oidc.sops.yaml
  - seafile-oidc.sops.yaml
  - authentik-grafana-oidc.sops.yaml
  - authentik-immich-oidc.sops.yaml
  - authentik-audiobookshelf-oidc.sops.yaml
  - kopia-repository.sops.yaml
  - kopia-server.sops.yaml
  - kopia-users.sops.yaml
  - authentik-proxmox-oidc.sops.yaml
  - authentik-technitium-oidc.sops.yaml
