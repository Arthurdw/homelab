apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure
  - cloudflare-api-token.sops.yaml
  - grafana-admin.sops.yaml
  - grafana-oidc.sops.yaml
  - alertmanager-smtp.sops.yaml
  - technitium-admin.sops.yaml
