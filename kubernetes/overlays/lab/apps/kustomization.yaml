---
# apps overlay for `lab`: the shared tree plus this cluster's SOPS secrets (kubernetes/overlays/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps
  - immich-db.sops.yaml
  - authentik-credentials.sops.yaml
  - authentik-smtp.sops.yaml
  - seafile-db.sops.yaml
  - seafile-admin.sops.yaml
  - seafile-smtp.sops.yaml
  - seafile-jwt.sops.yaml
  - kopia-repository.sops.yaml
  - kopia-server.sops.yaml
  - kopia-users.sops.yaml
  - authentik-seafile-oidc.sops.yaml
  - seafile-oidc.sops.yaml
  - authentik-grafana-oidc.sops.yaml
  - authentik-immich-oidc.sops.yaml
  - authentik-audiobookshelf-oidc.sops.yaml
  - seafile-lab-trust.yaml
patches:
  # Lab only: resolve auth.lab.ardw.be to Traefik and trust the internal CA for Seahub's OIDC calls.
  - target:
      kind: Deployment
      name: seafile
      namespace: seafile
    patch: |-
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: "10.99.100.100"
            hostnames: ["auth.lab.ardw.be"]
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REQUESTS_CA_BUNDLE
          value: /etc/lab-ca/ca.crt
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: lab-ca
          mountPath: /etc/lab-ca
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: lab-ca
          secret:
            secretName: seafile-lab-ca-trust
            items:
              - key: ca.crt
                path: ca.crt
  # Lab only: no GPU on the lab workers (talos/inputs.lab.env skips the GPU patch), so Immich ML and the
  # server run without the `nvidia` RuntimeClass and GPU limit; the CUDA image and the transcoder fall back
  # to the CPU.
  - target:
      kind: HelmRelease
      name: immich
      namespace: immich
    patch: |-
      - op: remove
        path: /spec/values/machine-learning/controllers/main/pod/runtimeClassName
      - op: remove
        path: /spec/values/machine-learning/controllers/main/containers/main/resources/limits/nvidia.com~1gpu
      - op: remove
        path: /spec/values/server/controllers/main/pod/runtimeClassName
      - op: remove
        path: /spec/values/server/controllers/main/containers/main/resources/limits/nvidia.com~1gpu
