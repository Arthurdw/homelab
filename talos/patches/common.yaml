# Applied to every node (control plane and worker) via `--config-patch`.
#
# Talos 1.14 machine config is multi-document: each section is its own document matched by
# apiVersion/kind. The legacy `machine:`/`cluster:` paths are not used because they collide with the
# generated documents and fail `talosctl validate`.
# https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/system-configuration/patching

# No bundled CNI: deleting the Flannel document is the 1.14 equivalent of `cni.name: none`.
# Cilium is installed by Flux (kubernetes/infrastructure/cilium), not as a Talos inline manifest,
# because inline manifests are applied once at bootstrap and never updated, which would take the
# CNI out of GitOps. Decision: docs/decisions.md §3.3.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete

# kube-proxy is disabled in controlplane.yaml, not here: Talos rejects a KubeProxyConfig document
# on workers.
---
# Container CIDRs (docs/decisions.md §2.3), pinned rather than left to the Talos defaults. Services
# are 10.96.0.0/16, not the default 10.96.0.0/12: a /12 spans 10.96.0.0-10.111.255.255, which takes
# in the lab network (10.99.100.0/24) and the storage link (10.99.0.0/29), so a ClusterIP could be
# allocated onto a node address. The /16 keeps the API service at 10.96.0.1 and CoreDNS at 10.96.0.10.
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - 10.244.0.0/16
serviceSubnets:
  - 10.96.0.0/16
