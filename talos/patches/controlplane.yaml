# Applied to control plane nodes only via `--config-patch-control-plane`.

# Disable Talos' kube-proxy: Cilium runs with kubeProxyReplacement (docs/decisions.md §3.3) and the
# two would both program service routing. This document is only valid on control plane machines,
# which is why it is not in common.yaml.
# https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false

# Topology (docs/decisions.md §3.1): 1 control plane + 1 worker. Workloads stay off the control
# plane through the control-plane taint in the generated KubeNodeConfig. For a single-node cluster,
# remove the taint with:
#
#   apiVersion: v1alpha1
#   kind: KubeNodeConfig
#   taints:
#     node-role.kubernetes.io/control-plane:
#       $patch: delete
---
# Lets pods in `system-upgrade` (tuppr, kubernetes/upgrades) call the Talos API, so a merged version bump
# upgrades the nodes without anyone running talosctl (docs/decisions.md §5.20). Talos then serves the
# talos.dev/v1alpha1 ServiceAccount CRD; tuppr's chart creates one and gets a talosconfig Secret back.
# os:admin is required: upgrade and upgrade-k8s are admin-only calls. The namespace list is the scope,
# so nothing outside system-upgrade can request a Talos credential. Control plane only: `talosctl
# validate` rejects this kind on workers.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
allowedKubernetesNamespaces:
  - system-upgrade
