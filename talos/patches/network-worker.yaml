# Production only (talos/inputs.env WORKER_NETWORK_PATCH; the libvirt lab sets it empty).
# talos-wk-1's second NIC on the 10 GbE storage link, and the node pinned to its primary network.
# Decision: docs/decisions.md §2.2. Selector reasoning: network-controlplane.yaml.

apiVersion: v1alpha1
kind: LinkAliasConfig
name: storage0
selector:
  match: link.driver == "virtio_net" && link.bus_path.endsWith(":13.0")
---
apiVersion: v1alpha1
kind: LinkConfig
name: storage0
up: true
mtu: 9000
addresses:
  - address: 10.99.0.4/29
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.20.0.0/24
---
# Host DNS via the UDM gateway only, so pods can resolve lab.ardw.be. Reasoning: network-controlplane.yaml.
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.20.0.1
