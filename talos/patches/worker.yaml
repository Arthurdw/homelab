# Applied to workers only via `--config-patch-worker`. Never apply it to the control plane.
#
# Declares the Talos user volume behind the node-local `local-path` StorageClass
# (docs/decisions.md §3.4, §4.3). /var is the EPHEMERAL partition and is not for unique data; a
# UserVolumeConfig gets its own partition mounted at /var/mnt/<name>.
# https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/storage-and-disk-management/disk-management/user
#
# Coupling: kubernetes/infrastructure/local-path/release.yaml sets the provisioner's nodePathMap to
# /var/mnt/local-path-provisioner, so `name` must stay `local-path-provisioner`. Change both together.
#
# Disk: `!system_disk` selects the dedicated 100 GiB data disk that OpenTofu attaches to the worker
# (infrastructure/environments/homelab/proxmox/talos.tf, data_disk_gb). The system disk cannot host
# the volume because EPHEMERAL consumes its free space. A node without a second disk (the lab
# worker) leaves this volume unprovisioned, so gen-configs.sh skips this file there (WORKER_PATCH).
#
# Size: min/maxSize bound the volume, and minSize also decides which disks are eligible. At least
# one of them is mandatory. 90GiB fits the 100GiB disk with margin for the 20Gi Immich Postgres PVC
# (kubernetes/apps/immich/postgres.yaml) to grow. volumeType stays the default (partition).
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
provisioning:
  diskSelector:
    match: "!system_disk"
  minSize: 90GiB
  maxSize: 90GiB
