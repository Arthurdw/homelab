# Image Factory schematic for every Talos node (production nocloud image and the libvirt lab's metal image).
# The platform only changes the image type (nocloud-installer vs metal-installer), never this file.
# The id is the sha256 of the canonical form, returned by:
#   curl -sX POST --data-binary @talos/schematic.yaml https://factory.talos.dev/schematics
# After editing, update TALOS_SCHEMATIC (talos/inputs.env, scripts/talos/gen-configs.sh) and
# talos_image_schematic_id (infrastructure/environments/homelab/proxmox) together. Decision: docs/decisions.md.
# The NVIDIA pair drives the passed-through Tesla P4 (Pascal: proprietary modules, not the open ones).
# Every node carries it, but only the production worker loads the driver (talos/patches/gpu-worker.yaml).
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/kata-containers
      - siderolabs/nonfree-kmod-nvidia-production
      - siderolabs/nvidia-container-toolkit-production
      - siderolabs/qemu-guest-agent
