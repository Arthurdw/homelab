# Image Factory schematic for the nodes without a GPU: talos-cp-1, talos-wk-2 and the libvirt lab's nodes
# (production nocloud image and the lab's metal image). The platform only changes the image type
# (nocloud-installer vs metal-installer), never this file. talos-wk-1 uses talos/schematic-gpu.yaml.
# The id is the sha256 of the canonical form, returned by:
#   curl -sX POST --data-binary @talos/schematic.yaml https://factory.talos.dev/schematics
# After editing, update TALOS_SCHEMATIC (talos/inputs.env, scripts/talos/gen-configs.sh). Decision: docs/decisions.md §3.5.
# No NVIDIA extensions here: on a node without the card, ext-nvidia-persistenced waits forever for the driver,
# the boot never completes, and Talos reboots the node every 70 minutes (its boot timeout).
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/kata-containers
      - siderolabs/qemu-guest-agent
