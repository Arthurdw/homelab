# Central version inventory.
# "latest" = newest *stable* observed on 2026-10-16 via upstream APIs (GitHub releases / TF registry).
# Review at each phase; update only via reviewed PRs. Open compatibility checks: verification_tasks.
# `# renovate:` lines feed the custom manager in renovate.json5. Each depName equals the one Renovate
# reports for the same pin in the manifests, so both files move in one PR. See docs/runbooks/upgrades.md.
meta:
  last_reviewed: "2026-10-20"
  policy: "pin exact versions; never floating tags; verify compat before adopting"

hypervisor:
  proxmox_ve: "9.x"             # owner reinstalled poseidon on 2026-10-21 (was 8.4.11); pve-manager 9.2.2 reported by the owner
  proxmox_kernel: "7.0.2-6-pve"  # running kernel after the 2026-10-21 reinstall (was 6.8.12-13-pve)

storage:
  truenas_scale: "25.10.7"      # owner reinstalled hercules-nas on 2026-10-21 (was 24.10.2.4); /etc/version reads 25.10.7, same as the L1 fixture ISO

kubernetes:
  # renovate: datasource=github-releases depName=siderolabs/talos
  talos: "v1.14.4"              # supports K8s 1.33-1.37 (Talos v1.14 support matrix, checked 2026-10-20)
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  kubernetes: "v1.37.1"         # newest stable (v1.38 still alpha)
  # renovate: datasource=github-releases depName=fluxcd/flux2
  flux: "v2.9.6"                # documented for K8s 1.34-1.36 (checked 2026-10-20). 1.37.1 is NOT on that list:
                                # prove Flux on 1.37.1 in the lab, or pin kubernetes to 1.36.x, before production.

iac:
  # renovate: datasource=github-releases depName=opentofu packageName=opentofu/opentofu extractVersion=^v(?<version>.+)$
  opentofu: "1.13.1"
  providers:
    bpg/proxmox:
      # renovate: datasource=terraform-provider depName=proxmox packageName=bpg/proxmox
      version: "0.116.1"
      opentofu_compat: "verified 2026-10-16 (tofu 1.13.1 validate)"
      pve_compat: "PVE 9: the provider changelog has PVE 9 features since 0.99.0 (2026-03-21, harule, 'PVE 9+') and 0.105.0 (2026-05-02, host_managed gated on PVE 9.1+); no release up to 0.117.0 lists a PVE 9 break. Proven on the PVE 9.2 L1 fixture, see verification_tasks (checked 2026-10-21)."
    truenas/truenas:
      # renovate: datasource=terraform-provider depName=truenas packageName=truenas/truenas
      version: "1.5.14"
      opentofu_compat: "verified 2026-10-16 (tofu 1.13.1 validate)"
      api_note: "No longer blocked on the version (checked 2026-10-21): 1.5.14 talks to /api/current (JSON-RPC) and needs SCALE >= 25.04; hercules-nas was reinstalled on 25.10.7, which matches the L1 fixture where the root was proven (scripts/lab/truenas-fixture-plan.sh). The live apply is still owner-gated."
    ubiquiti-community/unifi:
      # renovate: datasource=terraform-provider depName=unifi packageName=ubiquiti-community/unifi
      version: "0.59.0"
      stable: true
      opentofu_compat: "see verification_tasks"
      note: "newest stable (2026-10-03). 0.60.0-beta.0 exists; do NOT use betas for critical network automation"
    cloudflare/cloudflare:
      # renovate: datasource=terraform-provider depName=cloudflare packageName=cloudflare/cloudflare
      version: "5.27.0"
      opentofu_compat: "verified 2026-10-22 (tofu 1.13.1 validate, infrastructure/environments/homelab/cloudflare)"
      note: "5.27.0 is from 2026-10-03; 5.28.x was under two weeks old when pinned"
    hashicorp/random:
      # renovate: datasource=terraform-provider depName=random packageName=hashicorp/random
      version: "3.9.1"
      opentofu_compat: "verified 2026-10-22 (tofu 1.13.1 validate); generates the Cloudflare Tunnel secret"
    BadgerOps/unifi:
      version: "0.4.0"
      note: "alternative; check maintenance cadence before relying on it"

helm_charts:
  # Latest on Artifact Hub as of 2026-10-16. Pinned in kubernetes/**/release.yaml.
  # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
  cilium: "1.20.3"               # https://helm.cilium.io
  # renovate: datasource=helm depName=metallb registryUrl=https://metallb.github.io/metallb
  metallb: "0.16.1"              # https://metallb.github.io/metallb
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  traefik: "42.0.0"              # https://traefik.github.io/charts
  # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
  cert_manager: "1.21.2"         # https://charts.jetstack.io
  # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
  kube_prometheus_stack: "92.10.0"  # https://prometheus-community.github.io/helm-charts
  # renovate: datasource=helm depName=technitium-dnsserver registryUrl=https://charts.obeone.cloud
  technitium_dnsserver: "1.13.5"  # https://charts.obeone.cloud
  # renovate: datasource=docker depName=ghcr.io/immich-app/immich-charts/immich
  immich: "0.13.4"               # oci://ghcr.io/immich-app/immich-charts/immich (appVersion v3.2.0)
  # renovate: datasource=helm depName=audiobookshelf registryUrl=https://charts.christianhuth.de
  audiobookshelf: "2.5.1"        # https://charts.christianhuth.de (appVersion 2.37.1) — already latest
  # renovate: datasource=helm depName=authentik registryUrl=https://charts.goauthentik.io
  authentik: "2026.8.4"          # https://charts.goauthentik.io (appVersion 2026.8.4; bundled PostgreSQL, no Redis)
  # NFS CSI driver — dynamic PVCs on the NAS (kubernetes/infrastructure/storage).
  # The chart repo is the raw source tree: upstream publishes no GitHub Pages index.
  # renovate: datasource=helm depName=csi-driver-nfs registryUrl=https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  csi_driver_nfs: "4.13.5"       # https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  # Node-local provisioner — the `local-path` StorageClass for latency-sensitive databases
  # (docs/decisions.md §4.3, kubernetes/infrastructure/local-path). Official upstream OCI chart.
  # Chart digest sha256:81033683ce790e593524b2105945ee0d81bf6608f0c85eb5e0c1082cc74ff03d.
  # >= 0.0.36 is required (CVE-2026-44543 / GO-2026-5218).
  # renovate: datasource=docker depName=ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
  local_path_provisioner: "0.0.37"  # oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner

app_images:
  # Container images pinned in kubernetes/apps/** (not Helm charts). Pinned by tag@digest where the
  # upstream project itself pins an exact image.
  # renovate: datasource=docker depName=ghcr.io/immich-app/postgres
  immich_postgres: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
  # ^ exact image Immich ships in docker/docker-compose.yml; provides the VectorChord extension v3.x needs
  # Authentik dump CronJob (kubernetes/apps/authentik/backup.yaml) and scripts/backup/db-restore-test.sh,
  # which reuses the CronJob images (the immich one above, and this one). Same major as the chart's PostgreSQL.
  # renovate: datasource=docker depName=docker.io/library/postgres
  authentik_postgres: "docker.io/library/postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3"
  # Seafile (kubernetes/apps/seafile). The all-in-one CE image; its local_settings.py mount path embeds the
  # version, so bump the mount in seafile.yaml together with this tag.
  # renovate: datasource=docker depName=docker.io/seafileltd/seafile-mc
  seafile: "docker.io/seafileltd/seafile-mc:14.0.9@sha256:75d8b88e8bfaa54099082aec0e99ff1a962bd364bfc21da34125fa66998f0861"
  # renovate: datasource=docker depName=docker.io/library/mariadb
  seafile_mariadb: "docker.io/library/mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa"
  # renovate: datasource=docker depName=docker.io/library/memcached
  seafile_memcached: "docker.io/library/memcached:1.6.45-alpine@sha256:9e4de012dc607573052061c0bcb38abc775e1dd59b24e7ac38d1892842094aaf"
  # Kopia repository server (kubernetes/apps/kopia); household PCs back up to it over HTTPS.
  # renovate: datasource=docker depName=docker.io/kopia/kopia
  kopia: "docker.io/kopia/kopia:0.23.1@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e"
  # Stremio streaming server (kubernetes/apps/stremio); local-only, SPEC §12.6. v4.22.4 is from 2026-10-20.
  # renovate: datasource=docker depName=docker.io/stremio/server
  stremio: "docker.io/stremio/server:v4.22.4@sha256:bfce9268487bcf4b7baebc79e3504e14c2fac5a19aab2dbd722b151276f9db22"
  # Homepage dashboard (kubernetes/apps/homepage); v2.4.0 is from 2026-09-17; v2.5.0
  # (2026-10-10) was under two weeks old when this was pinned.
  # renovate: datasource=docker depName=ghcr.io/gethomepage/homepage
  homepage: "ghcr.io/gethomepage/homepage:v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61"
  # Cloudflare Tunnel connector (kubernetes/apps/cloudflared, homelab overlay only; docs/decisions.md §5.13).
  # 2026.9.3 is from 2026-09-24; 2026.10.x was under two weeks old when pinned.
  # renovate: datasource=docker depName=docker.io/cloudflare/cloudflared
  cloudflared: "docker.io/cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c"
  # Public share proxy for Immich (kubernetes/apps/immich/public-proxy.yaml). 4.0.0 is from 2026-10-07;
  # 4.1.x was under two weeks old when pinned.
  # renovate: datasource=docker depName=docker.io/alangrainger/immich-public-proxy
  immich_public_proxy: "docker.io/alangrainger/immich-public-proxy:4.0.0@sha256:54eb2a83f2d76a2e7e6b971638b011863ccb57a248e1d0a3e8a0f703c1f795dd"
  # Prometheus data-dir chown initContainer (kubernetes/infrastructure/monitoring/release.yaml)
  # renovate: datasource=docker depName=docker.io/library/busybox
  busybox: "docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e"
  # Technitium zone-bootstrap CronJob (kubernetes/infrastructure/technitium/bootstrap-zone.yaml)
  # renovate: datasource=docker depName=curlimages/curl
  curl: "curlimages/curl:8.23.0@sha256:a134550be58ab783810e613ae96fd253c38f7bdd16d9bf9be350700c7a29ac06"

ci_tools:
  # renovate: datasource=github-releases depName=terraform-linters/tflint extractVersion=^v(?<version>.+)$
  tflint: "0.64.0"
  # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
  trivy: "0.76.0"
  # renovate: datasource=pypi depName=checkov
  checkov: "3.3.29"
  # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
  gitleaks: "8.30.1"
  # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
  kubeconform: "0.8.0"
  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
  kustomize: "5.8.3"
  # renovate: datasource=github-releases depName=helm/helm extractVersion=^v(?<version>.+)$
  helm: "4.3.1"                 # CI render only. Flux 2.9.x helm-controller embeds Helm 4.2.x, so in-cluster installs use Helm 4 too
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind extractVersion=^v(?<version>.+)$
  kind: "0.33.0"

lab_fixture_images:             # scripts/lab/unifi-fixture.sh, scripts/lab/pve-fixture.sh, scripts/lab/truenas-fixture.sh (L1 fixtures; never production)
  unifi_network_application: "linuxserver/unifi-network-application:10.6.106-ls150@sha256:4d5fc889c2f2c2cecc6b35d4d641780cbedbe90d3a51b8f03283261b137af468"
  mongo: "mongo:8.0.34@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907"
  # Newest PVE 9.x installer (9.2-1, Debian 13 trixie); hypervisor.proxmox_ve is 9.x. sha256 from
  # https://enterprise.proxmox.com/iso/SHA256SUMS (download.proxmox.com fails its TLS hostname check here).
  proxmox_ve_iso: "proxmox-ve_9.2-1.iso"
  proxmox_ve_iso_url: "https://enterprise.proxmox.com/iso/proxmox-ve_9.2-1.iso"
  proxmox_ve_iso_sha256: "4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c"
  # TrueNAS SCALE 25.10.7 (Goldeye): the provider needs >= 25.04. sha256 equals the published
  # TrueNAS-SCALE-25.10.7.iso.sha256 next to the ISO, and was recomputed after download.
  truenas_scale_iso: "TrueNAS-SCALE-25.10.7.iso"
  truenas_scale_iso_url: "https://download.truenas.com/TrueNAS-SCALE-Goldeye/25.10.7/TrueNAS-SCALE-25.10.7.iso"
  truenas_scale_iso_sha256: "54ce9441ce66966a392e28f63604ca3c2c083d0bec4db7bb5af2f74f7a007c8e"

verification_tasks:
  - "DONE 2026-10-20: Talos v1.14 lists Kubernetes 1.37 as supported (docs.siderolabs.com/talos/v1.14/getting-started/support-matrix); talosctl gen config accepts v1.14.4 + 1.37.1"
  - "OPEN 2026-10-20: Flux v2.9.6 documents K8s 1.34-1.36 only. Prove it on 1.37.1 in the lab, or pin kubernetes to v1.36.x"
  - "DONE 2026-10-21: bpg/proxmox 0.116.1 on PVE 9.2.2 (L1 fixture, just lab-pve-plan): plan, apply, clean re-plan, destroy. PVE 9 removed the VM.Monitor privilege; the token role must not list it"
  - "DONE 2026-10-21: truenas/truenas 1.5.14 needs TrueNAS SCALE >= 25.04; the owner reinstalled hercules-nas on 25.10.7. Proven on a 25.10.7 L1 fixture (just lab-truenas-plan); the live apply is owner-gated"
  - "DONE 2026-10-20: UniFi provider stable is 0.59.0; pinned instead of 0.60.0-beta.0. UDM Pro API coverage is proven only by a plan, which waits on GATE 6"
  - "PARTIAL 2026-10-20: Helm 4 is what Flux 2.9.x uses in-cluster; every chart renders with helm 4.3.1 in CI (scripts/ci/render-helm-releases.sh). Install-time behaviour is proven only in the lab"
  - "DONE 2026-10-16: bpg/proxmox, truenas/truenas, ubiquiti-community/unifi validate under OpenTofu 1.13.1"
