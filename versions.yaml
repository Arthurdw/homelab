# Central version inventory.
# "latest" = newest *stable* observed on 2026-10-16 via upstream APIs (GitHub releases / TF registry).
# Review at each phase; update only via reviewed PRs. Open compatibility checks: verification_tasks.
meta:
  last_reviewed: "2026-10-16"
  policy: "pin exact versions; never floating tags; verify compat before adopting"

hypervisor:
  proxmox_ve: "8.4.11"          # live on poseidon
  proxmox_kernel: "6.8.12-13-pve"

storage:
  truenas_scale: "24.10.2.4"    # live on hercules-nas

kubernetes:
  talos: "v1.14.4"              # supports K8s 1.33-1.37 (Talos v1.14 support matrix, checked 2026-10-20)
  kubernetes: "v1.37.1"         # newest stable (v1.38 still alpha)
  flux: "v2.9.6"                # verify supported K8s range against pinned K8s

iac:
  opentofu: "1.13.1"
  providers:
    bpg/proxmox:
      version: "0.116.1"
      opentofu_compat: "verified 2026-10-16 (tofu 1.13.1 validate)"
    truenas/truenas:
      version: "1.5.14"
      opentofu_compat: "verified 2026-10-16 (tofu 1.13.1 validate)"
      api_note: "verify supported TrueNAS release + API version"
    ubiquiti-community/unifi:
      version: "0.60.0-beta.0"
      stable: false
      opentofu_compat: "verified 2026-10-16 (tofu 1.13.1 validate)"
      note: "latest is a pre-release — do NOT use betas for critical network automation"
    BadgerOps/unifi:
      version: "0.4.0"
      note: "alternative; check maintenance cadence before relying on it"

helm_charts:
  # Latest on Artifact Hub as of 2026-10-16. Pinned in kubernetes/**/release.yaml.
  cilium: "1.20.3"               # https://helm.cilium.io
  metallb: "0.16.1"              # https://metallb.github.io/metallb
  traefik: "42.0.0"              # https://traefik.github.io/charts
  cert_manager: "1.21.2"         # https://charts.jetstack.io
  kube_prometheus_stack: "92.10.0"  # https://prometheus-community.github.io/helm-charts
  technitium_dnsserver: "1.13.4"  # https://charts.obeone.cloud
  immich: "0.13.4"               # oci://ghcr.io/immich-app/immich-charts/immich (appVersion v3.2.0)
  audiobookshelf: "2.5.1"        # https://charts.christianhuth.de (appVersion 2.37.1) — already latest
  # NFS CSI driver — dynamic PVCs on the NAS (kubernetes/infrastructure/storage).
  # The chart repo is the raw source tree: upstream publishes no GitHub Pages index.
  csi_driver_nfs: "4.13.5"       # https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  # Node-local provisioner — the `local-path` StorageClass for latency-sensitive databases
  # (docs/decisions.md §4.3, kubernetes/infrastructure/local-path). Official upstream OCI chart.
  # Chart digest sha256:81033683ce790e593524b2105945ee0d81bf6608f0c85eb5e0c1082cc74ff03d.
  # >= 0.0.36 is required (CVE-2026-44543 / GO-2026-5218).
  local_path_provisioner: "0.0.37"  # oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner

app_images:
  # Container images pinned in kubernetes/apps/** (not Helm charts). Pinned by tag@digest where the
  # upstream project itself pins an exact image.
  immich_postgres: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
  # ^ exact image Immich ships in docker/docker-compose.yml; provides the VectorChord extension v3.x needs

ci_tools:
  tflint: "0.64.0"
  trivy: "0.76.0"
  checkov: "3.3.29"
  gitleaks: "8.30.1"
  kubeconform: "0.8.0"
  kustomize: "5.8.3"
  helm: "4.3.1"                 # Helm 4 is a major version — verify chart compatibility
  kind: "0.33.0"

verification_tasks:
  - "DONE 2026-10-20: Talos v1.14 lists Kubernetes 1.37 as supported (docs.siderolabs.com/talos/v1.14/getting-started/support-matrix); talosctl gen config accepts v1.14.4 + 1.37.1"
  - "Flux v2.9.6 supported Kubernetes range"
  - "truenas provider supported TrueNAS 24.10.x API endpoints / resource coverage"
  - "UniFi provider: stable vs beta; UDM Pro API coverage"
  - "Helm 4 chart/release compatibility for all chosen charts"
  - "DONE 2026-10-16: bpg/proxmox, truenas/truenas, ubiquiti-community/unifi validate under OpenTofu 1.13.1"
